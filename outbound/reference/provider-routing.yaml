# Provider routing (list production)
#
# What this is: the ORDER in which FNNL's approved tools are tried for each
# data field, plus the per-field success test, the inputs each rung needs, and
# the depth knobs. It is read by scripts/list_waterfall.py (which plans the
# queues and never calls a provider) and by the skills that run the list build
# (/tam-build, /email-waterfall, /list-quality-scorecard).
#
# Who owns what (precedence: stack contract > this file > skill prose):
#   - outbound/stack-contract.yaml owns WHICH tools are in the stack and the
#     email ORDER. approved_stack rule 4 ("overlaps run cheapest-capable
#     first") points to lead_data.contact_enrichment.notes, which records the
#     email waterfall. This file is the machine-readable mirror of that order.
#     A tool that is not in the approved six may not appear here, and Clay (the
#     list workbench) and PlusVibe (the sending platform) are never providers.
#   - THIS file turns the contract into rungs the planner can run. It must not
#     re-order anything the contract records. To change the email order,
#     change the contract first (an operator directive), then this file, then
#     skill prose. test_list_waterfall.py fails if this file's email order and
#     the contract's recorded order drift apart.
#   - Anything here that the contract does NOT record is marked "unverified".
#     It is a working default, not a decision.
#
# Status: the email order is the contract's (operator directive 2026-09-18,
# verifier updated 2026-09-22). It is not benchmarked, and the contract itself
# says cost evidence is asymmetric (Prospeo's pricing is unconfirmed), so it is
# not yet proven cheapest-first. All four providers are `chosen` in the
# contract, not `live`: none has made a real call on FNNL's own account.
# When a benchmark or a contract change moves an order, update the order, set
# that layer's `evidence:`, bump routing_version, and log the decision.
#
# 2026-09-28 (operator decisions for the A-Sales port): company discovery is
# FILTER-FIRST (layers.company_discovery below; overrides the 2026-09-22
# "lookalike is a MUST"), and a tool that is out of balance, down or switched
# off stops the run and asks the operator (/tool-balance-guard; overrides the
# 2026-06-19 "finder down, enricher becomes finder" exception). Neither order
# is benchmarked.
#
# 2026-10-05 (operator, the Aaron-flow port, outbound/reference/aaron-flow.md):
# advanced people search runs in AI ARK ONLY (layers.people_discovery below).
# One people search per vertical carries the company filters and the title
# stack, is refined on a 200-row sample with include and exclude keywords, and
# runs at scale through REST (scripts/aiark_people.mjs). GetLeads and Prospeo
# are no longer people-discovery rungs. The reservoir (profiles/_reservoir/,
# scripts/reservoir.py) is rung 0 of the email waterfall; the contract's email
# order is unchanged. Not benchmarked.

schema_version: 1
routing_version: 2026-10-05-aiark-people-first
status: contract_order_not_benchmarked

providers:
  aiark:
    name: AI Ark
    access: mcp_or_rest        # hosted MCP + REST, AI_ARK_API_KEY (stack contract approved_stack)
    concurrency: untested      # unverified: the contract records no concurrency or rate limit
    cost_note: "AI Ark pricing is vendor-confirmed per the contract (credits). Email finding uses a route that charges 0 credits when no email is found: /v1/people/export/single per shipped person (unverified live, see endpoints.email_finder) or /v1/people/email-finder on a search trackId. NEVER use the bulk /v1/people/export path: it bills 0.5 credits PER PROFILE EVEN ON A MISS (contact_enrichment.notes)"
    endpoints:
      company_discovery: "company_search (primary call). Resolve enums first with industry_search, technology_search and location_search; guessed values silently return wrong results. Page size default 25, max 100, 0-based pages; surface totalElements"
      people_discovery: "REST POST /v1/people through scripts/aiark_people.mjs (0.5 credits per result, no email reveal): titles, seniority, function and the company text fit needs. The MCP people_search has no keyword exclude, so refined searches never use it (outbound/reference/ai-ark-people-discovery.md)"
      email_finder: "per shipped person: /v1/people/export/single by person id (1 credit only when an email is found, per AI Ark's CLI source 2026-10-05; UNVERIFIED LIVE, the first run confirms a miss bills 0). /v1/people/email-finder (0 credits on a miss) works on a whole search page's trackId, so it would also pay for people at companies fit dropped"
      email_finder_path_verified: true    # 2026-10-06 (propfuel, outbound/scripts/aiark_email_single.mjs): 25 lookups, 23 found = 23 credits, 2 misses = HTTP 404 "no email found" at 0 credits (balance 47,579.7 to 47,556.7); X-Credit header is negative (-1.0); person emails at body.email.output[], body.company.contact.email is the org inbox
      not_a_finder: "/v1/people/export is never a rung (0.5 credits per profile even on a miss)"
    email_note: "labels CATCH_ALL as its own email type alongside SMTP, which is why it leads the email waterfall. Keep that label as its own column: it is a second catch-all signal, never the send gate (MillionVerifier's verdict is)"
  prospeo:
    name: Prospeo
    access: mcp_or_rest        # MCP connector + REST, PROSPEO_API_KEY (stack contract approved_stack)
    concurrency: untested      # unverified
    cost_note: "charges nothing when no result is found; free re-enrichment within 90 days (contact_enrichment.notes). Pricing tiers are UNCONFIRMED (third-party only), so this order is not yet proven cheapest-first"
    input_note: "REST bulk limit is 50 persons per request (contact_enrichment.notes); the MCP bulk_enrich_person tool takes 25 per call (live MCP schema read 2026-09-24). Documented minimum match is name plus a company identifier; LinkedIn-URL-alone is UNPROVEN"
    email_note: "status is binary (VERIFIED / UNAVAILABLE) and collapses catch-all into valid. Read verification_method (SMTP / BOUNCEBAN) instead of status, and re-verify every email with MillionVerifier regardless"
  getleads:
    name: GetLeads
    access: mcp                # hosted MCP, OAuth, no .env key; the REST API has no public docs (intent_signals.notes)
    concurrency: untested      # unverified
    cost_note: "two separate balances: PLAN CREDITS cover search, export and enrich (search_contacts bills 1 credit per record returned, 0 if none, live MCP schema 2026-09-24); PREPAID WALLET CASH covers only live scrapes. insufficient_wallet_cash is never 'out of credits'. FNNL's GetLeads plan tier is not recorded (unverified)"
    email_note: "GetLeads labels the emails it returns VALID after its own verification pass, but that label does NOT filter out catch-alls. It is a provider signal only: MillionVerifier verifies every one, like any other source"
    role_note: "the contract's deliberate SECOND source for company discovery (the gap-fill when an AI Ark universe comes back thin) and the secondary contact source (company_discovery.notes, contact_discovery.notes). Not an email rung in the contract's waterfall"
  millionverifier:
    name: MillionVerifier
    access: local_mcp_and_rest # outbound/scripts/mcp/millionverifier_mcp.mjs + REST, MILLIONVERIFIER_API_KEY; the key travels as a URL query parameter (vendor design), so scrub it from any error text
    concurrency: untested      # unverified: no rate limit is recorded in the contract
    cost_note: "credits per verification, deducted per real-time call; the bulk per-email rate is NOT confirmed (email_verification.notes)"

layers:
  # --- Company level ---------------------------------------------------------
  company_discovery:
    # FILTER-FIRST (operator decision 2026-09-28, a standing rule for every
    # client; overrides the 2026-09-22 "lookalike is a MUST"). Count and filter
    # the company universe first: AI Ark company_search is the source-of-truth
    # universe, then GetLeads count_contacts (an exact count at 0 credits) sizes
    # and cross-checks the same filters, and GetLeads is also the top-up when the
    # AI Ark universe comes back thin (the distinct domains on its contact rows,
    # one union deduped on company_domain). Not a per-cell waterfall.
    # Lookalike seeding is an option or an exception, never required. Reveal
    # and lookup-by-person calls stay OUT of discovery: GetLeads
    # lookup_decision_makers always returns VALID emails and bills 1 credit per
    # record, so it is a reveal, not a discovery rung. Record the route used in
    # run_state.discovery_route (filter | lookalike; missing reads as filter).
    # Aaron flow (2026-10-05): the filter route is people-first. The pull is
    # the vertical's refined AI Ark people search (layers.people_discovery)
    # rolled up to companies; company_search totalElements is read as the
    # count and cross-check, and a company-only company_search pull runs only on
    # the lookalike route or for a step that needs companies before people.
    # /tam-build runs this layer.
    route_default: filter
    order: [aiark]             # company_search after enum resolution (industry_search, technology_search, location_search); the source-of-truth company universe (company_discovery.notes)
    widening_topup: [getleads] # count_contacts / export_contacts on the same filters; the top-up when the AI Ark universe comes back thin (company_discovery.notes)
    requires:
      aiark: [filters]         # resolved enums, headcount, geography; guessed enum values silently return wrong results
      getleads: [filters]      # employee_profiles_on_linkedin_min/max, office_countries, job_titles, keyword filters over company About text (provider-capability-matrix.md)
    lookalike:
      provider: prospeo        # company_lookalike: in the schema, UNTESTED and not in the contract (provider-capability-matrix.md)
      only_when: "the offer needs a lookalike AND the TAM is small or hard to build by filters (both), and the operator approves the untested tool"
    success: "account passes the fit gate (fit_status good or maybe) AND the account QA in list_qa.py"
    evidence: "operator decision 2026-09-28 (filter-first); quality and cost unmeasured"

  headcount_crosscheck:
    # Headcount decides ICP eligibility, so one provider's number is not trusted
    # when it is missing, borderline, conflicting, or the pull shows a filter leak.
    # Only those rows escalate; a confident in-range count is never re-bought.
    # unverified: the contract records no headcount cross-check order. This order
    # follows the company-discovery source of truth, then the contract's second
    # source, then Prospeo's company filters (approved_stack also_covers).
    trigger: [missing, borderline, conflicting]
    order: [aiark, getleads, prospeo]   # aiark company_search; getleads employee_profiles_on_linkedin_min/max (live MCP schema 2026-09-24); prospeo company_headcount_range (live MCP schema 2026-09-24)
    max_checks_per_account: 1
    evidence: none_yet

  # --- Person level ----------------------------------------------------------
  contact_new_in_seat:
    # unverified: a candidate Layer-1 contact-discovery signal (people who
    # started their current role recently). Use it only as a discovery filter,
    # never as a reveal. 2026-10-05: advanced people search runs in AI Ark only
    # (ruling people-discovery), so this filter rides on the AI Ark people
    # search as contact.experience.current.duration.currentJob (a max of N
    # months), documented in AI Ark's CLI filter list, untested on FNNL's
    # account. The Prospeo (person_time_in_current_role) and GetLeads
    # (job_start_date_min) filters it used before are no longer people-search
    # rungs; the signal still only sets send order, never shrinks the list.
    order: [aiark]
    requires:
      aiark: [company_domain]       # people search contact.experience.current.duration.currentJob.max.month (or the start date on the returned rows)
    evidence: "operator decisions 2026-09-28 and 2026-10-05; not benchmarked, not in the contract"

  people_discovery:
    # AI ARK ONLY (operator 2026-10-05, ruling people-discovery). Discovery is
    # one AI Ark people search per vertical that carries the company filters and
    # the offer's title stack, refined on a 200-row sample (include and exclude
    # keywords mined from the fit and wrong-fit companies) before it runs at
    # scale in slices under the 10,000-result cap. The procedure is
    # outbound/reference/ai-ark-people-discovery.md; the runner is
    # scripts/aiark_people.mjs (REST, because the MCP has no keyword exclude).
    # Companies added by the GetLeads widening top-up still get their people
    # from AI Ark, by company domain. GetLeads and Prospeo are not rungs here.
    # The standing excludes ride on every call (ruling discovery-exclusions).
    # The main vertical search runs through aiark_people.mjs, not the planner.
    # `list_waterfall.py plan --layer people` now plans only the per-company
    # pass for companies the GetLeads top-up added, on AI Ark alone.
    order: [aiark]
    requires:
      aiark: [company_domain]       # per-company pass for top-up companies: the vertical search's filters plus account.domain include
    retry_on_error: 1
    evidence: "operator directive 2026-10-05 (AI Ark only, 200-row sample loop); quality and cost unmeasured"

  email:
    # The contract's waterfall (lead_data.contact_enrichment.notes):
    #   STEP 0 verify first any email the row already carries (the planner queues
    #          it for the verifier before any finder rung);
    #   STEP 1 AI Ark reveal across the whole survivor set;
    #   STEP 2 MillionVerifier on everything AI Ark returned;
    #   STEP 3 Prospeo ONLY on rows AI Ark left blank or MillionVerifier rejected
    #          (invalid, unknown, error, disposable);
    #   STEP 4 MillionVerifier on everything Prospeo returned.
    # The planner stops a person at the first MillionVerifier `valid`.
    # Rung 0 (Aaron flow, 2026-10-05): the reservoir. A person whose email
    # MillionVerifier rated ok in the last 90 days (profiles/_reservoir/,
    # scripts/reservoir.py lookup) is verified on that email first, before any
    # finder rung is paid. It is a lookup, not a provider, so it is not in
    # `order`; every verdict is written back after verification.
    order: [aiark, prospeo]
    # A catch_all verdict is NOT a rejection: it goes to the holdback, never to
    # Prospeo (contact_enrichment.notes step 3). `stop` ends that person's
    # waterfall at a catch_all and writes the address to
    # leads.catchall-holdback.csv. The script default is `continue`.
    on_catch_all: stop
    # "Never open Prospeo on a row AI Ark has not already attempted"
    # (contact_enrichment.notes). TOOL-BALANCE GUARD (operator decision
    # 2026-09-28, /tool-balance-guard): a tool that is out of balance, down or
    # switched off STOPS the run and the operator is asked. Never substitute
    # another tool for it. A skip happens only on the operator's say-so, logged
    # with `plan --skip-provider aiark --skip-reason "<the error seen>"
    # --operator-approved-skip`, and recorded as detail.operator_approved; the
    # planner refuses the skip without that flag.
    requires_attempted:
      prospeo: [aiark]
    requires:
      aiark: [first_name, last_name, company_domain]     # /v1/people/export/single takes the AI Ark person id from discovery (or a LinkedIn URL); unverified live. The planner needs a real name on every finder rung anyway
      prospeo: [first_name, last_name, company_domain]   # enrich-person minimum match: name plus a company identifier (contact_enrichment.notes); LinkedIn-URL-alone is unproven
    # Buyer-priority depth: the most rungs a person of each role tier may use.
    # Default is the full waterfall for every tier. Lower a tier only with a
    # cost reason, and log it.
    max_rungs_by_role_tier: {exact: 2, strong: 2, influencer: 2, adjacent: 2, weak: 2}
    retry_on_error: 1
    evidence: "stack contract lead_data.contact_enrichment.notes (operator directive 2026-09-18, verifier 2026-09-22); not benchmarked, and cheapest-first is not yet proven because Prospeo's pricing is unconfirmed"

  # phone: deliberately NOT set. The stack contract records no confirmed phone
  # source for AI Ark or Prospeo. (Prospeo's MCP schema, read 2026-09-24, offers
  # mobile lookup at 10 credits per matched record, but that is not in the
  # contract and not proven on FNNL's account.) With no phone layer, a targeting
  # spec that sets buyers.phone_required stops the planner with a clear error.
  # Add a phone layer here only after the contract records a phone source.

  linkedin_backfill:
    # unverified: the contract records no LinkedIn backfill order. This follows
    # /email-waterfall's backfill routing: the contact-discovery source by name
    # first, then the contact-enrichment tools, then the secondary contact
    # source's email-to-LinkedIn batch lookup.
    order: [aiark, prospeo, getleads]
    requires:
      aiark: [first_name, last_name, company_domain]      # unverified input fields
      prospeo: [first_name, last_name, company_domain]    # enrich_person returns the full profile (live MCP schema 2026-09-24); unproven on FNNL's account
      getleads: [email]                                   # getleads_get_linkedin_urls_from_emails_batch: work email in, LinkedIn URL out, 1 credit per success (live MCP schema 2026-09-24)
    write_only_on: "name AND current company match; a wrong LinkedIn is worse than a blank one"
    evidence: none_yet

  verification:
    provider: millionverifier             # the verifier of record (email_verification.notes); no source is exempt, including AI Ark's and Prospeo's own reveal-time checks
    cli: scripts/millionverifier_verify.mjs   # under outbound/; the runner whose output list_waterfall.py record --layer verify reads
    cache:
      path: profiles/_cache/verify-cache.jsonl   # under outbound/, gitignored with profiles/
      max_age_days: 90                     # a verdict older than this is re-verified (/email-waterfall's ~90-day revalidation prior; not a contract rule)
    retry_transient: 1                     # a transient result is retried once, then counts as unknown
    # Raw statuses (the verifier_raw_status column) that count as transient.
    # MillionVerifier's own `error` result (resultcode 4) is transient here; a
    # timeout or a rate limit on the call is too. A row whose email_status gate
    # is `transient` is transient whatever its raw status. Never cached.
    transient_raw_statuses: [error, timeout, rate_limited, ""]
    gate_map:                              # MillionVerifier resultcode (result) -> gate (email_verification.notes)
      1: valid                             # ok: the send file
      2: catch_all                         # catch_all: the holdback (leads.catchall-holdback.csv), never Prospeo. NEVER collapse into ok or unknown
      3: unknown                           # unknown: Prospeo gap-fill, then review
      4: transient                         # error: retried per retry_transient, then unknown
      5: invalid                           # disposable
      6: invalid                           # invalid
    evidence: stack_contract
