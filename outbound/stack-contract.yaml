# =============================================================================
# FNNL AGENCY: GTM STACK CONTRACT
# =============================================================================
#
# WHAT THIS IS
# This is the single source of truth for which tool fills which job in FNNL
# Agency's cold outbound system. It ships EMPTY on purpose. The system has no
# default tech stack and will not guess one.
#
# HOW THE SYSTEM USES IT
# Every skill in .claude/skills/ is written against a CAPABILITY ROLE ("the
# sending platform", "the contact enrichment tool"), never against a brand.
# When a skill needs a tool it reads the matching slot below. If the slot is
# still empty, the skill stops and tells you to run /stack-setup rather than
# assuming a vendor.
#
# HOW TO FILL IT
# Run /stack-setup. It interviews you about FNNL's actual tools, writes the
# answers here, activates any matching integration from _vendor-library/, and
# tells you which credentials are still missing. You can also edit this file
# by hand; the format is documented at the bottom.
#
# RELATIONSHIP TO run_state
# Each client's own profile (outbound/profiles/<slug>/
# client-profile.yaml) carries a `run_state` block that locks the tools for
# THAT client's campaigns. This contract is the workspace-level answer that
# a new client's run_state inherits from. The `run_state_field` key on each
# slot below names the exact run_state field it populates. Do not rename
# those fields; 50+ skills read them by name.
#
# STATUS VALUES
#   not_chosen: FNNL has not picked a tool for this job yet (the default)
#   chosen: a tool is named but not yet credentialed or tested
#   live: credentialed and verified working against a real call
#   n/a: FNNL does not need this capability at all
#
# =============================================================================

meta:
  company: FNNL Agency
  slug: fnnl
  contract_version: 1
  created: 2026-09-18
  last_reviewed: 2026-09-18
  # Set to true only once every required slot is `live`. Skills may check this
  # before an expensive or outward-facing run.
  stack_locked: false

# =============================================================================
# 1. SENDING INFRASTRUCTURE
#    Domains, mailboxes, and the platform that actually sends the campaigns.
# =============================================================================

infrastructure:

  registrar:
    tool: Dynadot
    status: chosen
    capability: >
      Buys and holds the cold outbound domains, and manages their DNS records
      (SPF, DKIM, DMARC, MX, tracking CNAME).
    run_state_field: run_state.registrar
    credentials: [DYNADOT_API_KEY, DYNADOT_API_SECRET]
    vendor_pack: null        # set by /stack-setup if a pack in _vendor-library/ matches
    notes: >
      DNS record writes ARE available via API, so domain setup is automatable.
      Current surface is REST v2, base https://api.dynadot.com/restful/v2/ .
      Register is POST /domains/{domain}/register, DNS is POST|GET|DELETE
      /domains/{domain}/records, balance is GET /accounts/info. An official MCP
      server also exists at https://mcp.dynadot.com/mcp .
      CONSTRAINTS from vendor docs, none yet proven against FNNL's own account:
      registration requires PREPAID ACCOUNT BALANCE (it fails rather than charging a
      card), an IP allowlist is available but optional, and rate limits are
      tier-gated by spend (Regular tier is 1 thread, 60 req/min). A free sandbox
      exists.
      OPEN: Dynadot's docs spell the auth signature header both X-Signature and
      Signature. Settle that in the sandbox before writing any client.
      STALE SCAFFOLD WARNING: _vendor-library/skills/domain-infra/ holds
      dynadot-zapmail and dynadot-primeforge skills built against Dynadot's OLDER
      api3.json surface, which REST v2 supersedes. Harvest the logic, do not trust
      the endpoints. Neither pairs with ScaledMail.

  mailbox_provider:
    tool: ScaledMail
    status: chosen
    capability: >
      Provisions the sending mailboxes on those domains, handles the Google
      Workspace / Microsoft 365 purchase, and exports them into the sending
      platform.
    run_state_field: run_state.mailbox_provider
    credentials: [SCALEDMAIL_API_KEY]
    vendor_pack: null
    notes: >
      Yes, they resell PRE-WARMED inboxes (POST /buy-pre-warm-inboxes), so a new
      client can launch in days rather than waiting roughly six weeks on warmup.
      That makes /mailbox-pool-staging worth standing up.
      API base https://server.scaledmail.com/api/v1, Bearer auth, key generated at
      app.scaledmail.com/settings, 5 req/sec.
      CRITICAL TIMING CONSTRAINT: ordering is self-serve via API, but FULFILLMENT IS
      MANAGED AND ASYNCHRONOUS. Their pricing page states infrastructure is built
      within 24 to 72 hours. An agent CANNOT create a mailbox synchronously. It must
      place the order, then POLL GET /domains and GET /mailboxes/{domain_id} for
      credentials. Any skill assuming same-session provisioning breaks here.
      Pull credentials via GET /mailboxes/{domain_id}, which returns email plus
      mailbox_password, and import them into the sending platform. Do NOT use their
      sequencer auto-connect block: it requires the sequencer password in plaintext
      in the request body.
      Plusvibe IS on their named compatible-platform list. Pricing read 2026-09-18:
      Google 3.50 USD per mailbox per month, Outlook 50 USD per domain per month for
      25 mailboxes, SMTP 3.75 USD per domain per month, SPF/DKIM/DMARC included.
      Minimums are not published.

  sending_platform:
    tool: Plusvibe.ai
    status: chosen
    capability: >
      Holds the campaigns, sequences, and lead lists. Sends the email, rotates
      the inboxes, runs warmup, and receives the replies. This is the most
      depended-on slot in the system.
    run_state_field: run_state.sending_platform
    credentials: [PLUSVIBE_API_KEY, PLUSVIBE_WORKSPACE_ID]
    vendor_pack: null
    notes: >
      All three gates PASS on documentation review. None is yet proven on a live call.
      1. REST API for campaign create plus lead upload: YES, two-step. POST
         /campaign/add/campaign creates an empty shell taking only workspace_id and
         camp_name. PATCH /campaign/update/campaign carries the real payload:
         sequences, then steps, then variations, each variation holding its own
         subject, preheader and body, plus schedules and email_accounts. Leads go in
         via POST /lead/add.
      2. Spintax: YES. {{random|a|b|c}} and {{fallback|{{var}}|default}}, case
         insensitive. UNCONFIRMED whether spintax evaluates in SUBJECT lines. Native
         per-step subject variations with var_sel_type R_ROBIN cover that need.
      3. Programmatic reply access: YES, both directions. Webhooks fire on
         FIRST_EMAIL_REPLIES, ALL_EMAIL_REPLIES and ALL_POSITIVE_REPLIES carrying the
         reply text, HMAC-SHA256 signed when a secret is set. GET /unibox/emails
         pulls full bodies. Triage write-back via POST /lead/data/update.
         TRAP: POST /lead/update/status is sending-state control (COMPLETED, PAUSED,
         UNPAUSED), NOT triage. Triage labels go through /lead/data/update.
      Base https://api.plusvibe.ai/api/v1, header x-api-key, workspace_id required on
      every endpoint, 5 req/sec. Docs at developer.plusvibe.ai, with a
      machine-readable endpoint index at developer.plusvibe.ai/llms.txt .
      COMMERCIAL GATE: API, webhooks and MCP all require the BUSINESS plan, 77 USD
      per month minimum. The 37 USD Personal tier is not programmable at all.
      An official MCP server exists at https://mcp.plusvibe.ai/mcp but passes the API
      key as a URL QUERY PARAMETER. The REST API is the real automation surface.

  infrastructure_stack:
    tool: dynadot_scaledmail
    status: chosen
    capability: >
      The named combination of registrar plus mailbox provider that a given
      client's domains run on, recorded as one value so later steps can branch
      on it.
    run_state_field: run_state.infrastructure_stack
    credentials: []
    vendor_pack: null
    notes: >
      Derived from Dynadot plus ScaledMail. This pairing is NEW to this workspace.
      The credential registry's stack_map ships only dynadot_zapmail,
      spaceship_zapmail, dynadot_primeforge, spaceship_primeforge and
      primeforge_native, so dynadot_scaledmail has been added there.
      DEFERRED BY OPERATOR 2026-09-18. Email infrastructure will NOT be set up
      through this system for now; the operator will confirm the path later.
      Until then, treat both infrastructure slots as named-but-dormant, and do
      not route a client to any domain or mailbox setup skill. The reminder is
      enforced at /cold-email-kickoff Step 6.0, which asks the operator whether
      infra is already handled before any client setup branch runs.
      THE OPEN FORK, for when this is picked back up: WHO BUYS THE DOMAINS.
      ScaledMail's bring-your-own-domain path (provider "other") conditionally
      requires a hosting object holding the REGISTRAR USERNAME AND PASSWORD IN
      PLAINTEXT, which is full account control rather than scoped DNS access. Worse,
      Dynadot is NOT on ScaledMail's named list of supported external registrars
      (Porkbun, Namecheap, DNSimple), so that path may not even function.
      The clean alternative is provider "buy", letting ScaledMail register the
      domains, so no FNNL registrar credential ever leaves the building. That also
      means Dynadot would not be used for cold-email infrastructure.
      Do not resolve this by defaulting. It is one support question to ScaledMail.

  mailbox_mix_strategy:
    tool: null
    status: not_chosen
    capability: >
      The policy (not a tool) for how many Google Workspace versus Microsoft
      365 mailboxes to buy for a given client, based on where their prospects
      actually read mail.
    run_state_field: run_state.mailbox_mix_strategy
    credentials: []
    vendor_pack: null
    notes: See /mailbox-mix-strategy. This is a decision, so leave `tool` null.

# =============================================================================
# 2. OUTREACH CHANNELS (non-email)
#    Email lives in section 1, because the whole sending stack hangs off it.
#    This section holds the OTHER channels FNNL runs outbound on, so a campaign
#    can be multi-channel without a skill having to guess where LinkedIn lives.
#    Added 2026-09-18 on operator instruction; the contract shipped email-only.
# =============================================================================

channels:

  linkedin_outreach:
    tool: HeyReach
    status: chosen
    capability: >
      Runs LinkedIn connection requests and message sequences across multiple
      sender accounts, as a second outbound channel alongside email.
    run_state_field: run_state.linkedin_outreach
    credentials: [HEYREACH_API_KEY]
    vendor_pack: null
    notes: >
      Built for agencies and multi-account sending: connection requests,
      message sequences with conditional branching, and sender rotation across
      accounts are all confirmed.
      API base https://api.heyreach.io/api/public , header X-API-KEY, rate
      limit 300 requests per minute SHARED ORG-WIDE (not per key, so parallel
      fan-out has to budget against one pool). Create campaign, add leads and
      read replies are all confirmed. Replies come two ways and the vendor's own
      pattern is to use BOTH: a webhook push, which carries only the latest
      message, plus a REST "get chat room" pull for full history.
      Docs are a Postman collection at
      documenter.getpostman.com/view/23808049/2sA2xb5F75 . Note that
      documentation.heyreach.io does NOT resolve.
      An official remote MCP server exists, per-workspace URL and key, included
      on every paid tier including the 79 USD entry plan.
      INTEGRATION GAP THAT MATTERS: HeyReach natively integrates with Instantly,
      Smartlead and EmailBison, where email is a STEP TYPE inside the LinkedIn
      sequence rather than a data sync. PLUSVIBE IS NOT ON THAT LIST. So genuine
      interleaved email-plus-LinkedIn sequencing is NOT available out of the box
      on FNNL's chosen pairing. Running both channels means orchestrating them
      separately, or writing custom glue against both REST APIs.
      PRICING, read 2026-09-18, and widely mis-stated: the page tagline implies
      unlimited senders on a flat fee, but Growth is 79 USD PER SENDER (the card
      carries a quantity stepper). Agency 999 USD covers 25 senders, Unlimited
      2,999 USD is genuinely unlimited. Budget per sender, not per account.

# =============================================================================
# 3. LEAD DATA
#    Finding the companies, finding the people, and getting their real contact
#    details. This is where most of the money gets spent, so the ordering
#    between these slots matters as much as the tools themselves.
# =============================================================================

lead_data:

  company_discovery:
    tool: AI Ark
    status: chosen
    capability: >
      Produces the universe of target companies from an ICP definition. Could
      be a lookalike engine, a database with firmographic filters, a maps or
      directory scrape, or a public registry pull.
    run_state_field: null
    credentials: [AI_ARK_API_KEY]
    vendor_pack: null
    notes: >
      AI Ark is the source-of-truth company universe: 70M+ companies with
      firmographic, technographic, funding, headcount-growth and geo filters.
      company_search is the primary call.
      MANDATORY PRE-STEP: the search enums must be resolved before filtering. Call
      industry_search, technology_search and location_search (or read the
      ark://reference/* resources) to get exact enum values. Guessed values silently
      return wrong results. When a user describes an intent like "retail", select ALL
      matching industry values, typically 5 to 20+, not one.
      Pagination: the response carries totalElements and totalPages, default size 25,
      max 100, page is 0-based. Always surface totalElements so the real match count
      is visible.
      GetLeads also does company discovery and is the deliberate SECOND source, kept
      in intent_signals rather than here so the source-of-truth layer stays single.
      If a TAM comes back thin from AI Ark, GetLeads is the gap-fill to try before
      buying a third tool.

  contact_discovery:
    tool: AI Ark
    status: chosen
    capability: >
      Finds the right people inside a target company (title, seniority,
      function, tenure) without necessarily revealing their email yet.
    run_state_field: null
    credentials: [AI_ARK_API_KEY]
    vendor_pack: null
    notes: >
      people_search covers 400M to 500M profiles (vendor claim, unaudited) and
      returns titles, seniority, function and company linkage WITHOUT revealing
      email, which is exactly the cheap-qualify-before-reveal split this slot wants.
      Keep discovery and reveal separate: qualify the slice on people_search first,
      then pay for reveal only on the survivors via contact_enrichment.
      Same enum pre-step as company_discovery applies.
      GetLeads is the secondary contact source, 402M contacts with 179 fields per
      lead (52 contact, 127 company), reachable through its MCP.

  contact_enrichment:
    tool: AI Ark -> Prospeo (waterfall)
    status: chosen
    capability: >
      Reveals work email addresses, and optionally phone numbers, for the
      contacts you decided are worth paying for.
    run_state_field: run_state.tam_enrichment_path
    credentials: [AI_ARK_API_KEY, PROSPEO_API_KEY]
    vendor_pack: prospeo
    notes: >
      WATERFALL ORDER, mirror this into /email-waterfall:
        STEP 1, AI Ark, across the whole survivor set.
        STEP 2, Prospeo, ONLY on the rows AI Ark left blank.
      Never open Prospeo on a row AI Ark has not already attempted.
      WHY AI ARK IS PRIMARY: it labels CATCH_ALL as a distinct email type alongside
      SMTP, which is the signal /list-quality-scorecard needs. Prospeo's status field
      is binary (VERIFIED / UNAVAILABLE) and therefore COLLAPSES catch-all into
      valid. Prospeo's verification_method field (SMTP / BOUNCEBAN) recovers the
      signal, so any pipeline reading Prospeo output MUST read verification_method,
      not status alone, or it will quietly inflate bounce rate.
      USE THE RIGHT AI ARK ENDPOINT: route gap-fill through /v1/people/email-finder,
      which charges 0 credits when no valid email is found. The bulk /v1/people/export
      path bills 0.5 credits PER PROFILE EVEN ON A MISS (vendor's own worked example:
      1,000 rows costs 500 credits whether 700 or 1,000 resolve). That is the
      difference between paying per hit and paying per row routed.
      Prospeo charges nothing when no result is found and offers free re-enrichment
      within 90 days. Its enrich-person endpoint takes linkedin_url, but the
      documented minimum match is name plus a company identifier, so LinkedIn-URL-
      alone is UNPROVEN. Bulk is 50 persons per request.
      COST EVIDENCE IS ASYMMETRIC, DO NOT CLAIM CHEAPEST-FIRST IS SATISFIED YET:
      AI Ark's pricing is vendor-confirmed, Prospeo's is third-party only (tiers
      reported as 39 / 99 / 199 / 369 USD, UNCONFIRMED, their pricing page is
      JavaScript-rendered). Read Prospeo's real pricing from a logged-in account and
      re-check this ordering before treating the waterfall as cost-optimal. The
      catch-all rationale above holds regardless of price.
      Both vendors verify at reveal time using the SAME engine, BounceBan.

  email_verification:
    tool: null
    status: not_chosen
    capability: >
      Confirms a revealed address will actually accept mail, and flags
      catch-all domains, before that address ever enters a campaign.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      GENUINE GAP. NOTHING IN FNNL'S STACK FILLS THIS. Do not assume otherwise.
      Neither AI Ark nor Prospeo is a verification product. Both are finders that
      verify at reveal time via BounceBan and neither exposes a standalone
      "feed me a list of emails, get back statuses" endpoint.
      Prospeo's Email Verifier API is REMOVED, not merely undocumented. A live
      unauthenticated probe on 2026-09-18 returned error_code DEPRECATED for
      /email-verifier, /email-finder, /linkedin-email-finder, /domain-search and
      /mobile-finder, while /enrich-person returned INVALID_API_KEY and a bogus
      endpoint returned a plain 404. The marketing page for the verifier is stale.
      Plusvibe bundles verification in its credit allowance, but its CATCH-ALL
      handling is UNVERIFIED, so it is not recorded here on the strength of being
      bundled.
      WHAT THIS BLOCKS: re-verification of an aged list before send, and
      /list-quality-scorecard gating on deliverability as an independent check rather
      than trusting the finder's own at-reveal verdict. Bounce risk on any list not
      freshly revealed is currently unmanaged.
      TO CLOSE IT: either test Plusvibe's bundled verifier for catch-all handling and
      record the result here, or add a dedicated verifier. The parked
      _vendor-library/scripts/deliverable/ pack is an email verification client from
      the upstream workspace and is the cheapest thing to evaluate first.

  intent_signals:
    tool: GetLeads
    status: chosen
    capability: >
      Third-party buying-intent or technographic data that says a company is
      in-market right now, as opposed to merely fitting the ICP.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Credentials are empty ON PURPOSE: GetLeads authenticates by OAuth through its
      MCP server at https://app.getleads.io/api/mcp , roughly 45 tools, so there is
      no .env key. A REST API exists but has NO public documentation
      (docs.getleads.io does not resolve), so the MCP is the only supported surface.
      HONEST SCOPE: this is NOT third-party buying-intent data. There is no Bombora,
      G2 or 6sense here. What GetLeads gives is (a) company state attributes you
      filter on, namely funding, hiring, headcount, technographics and traffic, and
      (b) genuine live scrapes: website-visitor identification pixels, LinkedIn
      post-engager monitoring and company-follower scrapes. list_funding_signals and
      list_acquisition_signals exist as tools.
      Treat funding and hiring as filters, not as real-time event alerts, unless a
      test proves recency.
      BILLING MODEL, TWO SEPARATE BALANCES, DO NOT CONFLATE THEM:
        PLAN CREDITS cover search, export and enrich. Free tier 1,000 credits,
        Partner 249 USD/mo, Unlimited 497 USD/mo. "Unlimited" is still governed by a
        daily and monthly fair-use budget.
        PREPAID WALLET CASH covers only the live scrapes, for example website-visitor
        identification at a published 0.125 USD per newly identified lead.
      An empty wallet returns insufficient_wallet_cash while search and export keep
      working normally. NEVER report "out of credits" on a wallet failure; that would
      ship a false outage.
      OPEN QUESTION WORTH ASKING THE VENDOR: the MCP surface exposes more than the
      marketing site advertises, including acquisition signals that appear nowhere
      publicly, and the site still lists post-engagement as COMING SOON while the
      tool already exists. Confirm those are supported before building a campaign on
      them. The payload shape, recency and upstream source of the funding and
      acquisition signals are UNKNOWN; only tool existence is established.

# =============================================================================
# 4. AI AND RESEARCH
#    The models that research, classify, and write. Splitting these slots is
#    deliberate: the cheapest model that can do bulk classification is almost
#    never the model you want writing final copy.
# =============================================================================

ai:

  research_provider:
    tool: Parallel.ai
    status: chosen
    capability: >
      Primary web research engine for ICP, offer, and account research. Should
      return sourced, citable answers rather than unattributed prose.
    run_state_field: run_state.ai_research_provider
    credentials: [PARALLEL_API_KEY]
    vendor_pack: null
    notes: >
      Purpose-built for agent web research and returns source-attributed results with
      calibrated confidence, which is what this slot asks for over unattributed prose.
      Relevant products: Search API for real-time retrieval, Task API for deep
      research in a single call, FindAll for entity discovery, Monitor for continuous
      tracking, plus an OpenAI-compatible Responses API.
      This is a RESEARCH engine, not a general-purpose LLM. It does not fill
      bulk_classification or copywriting, both of which remain open.

  bulk_classification:
    tool: null
    status: not_chosen
    capability: >
      Cheap, high-volume classification and extraction at TAM scale (ICP fit
      scoring, hard-no filtering, field extraction across thousands of rows).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      GAP. Operator confirmed 2026-09-18 that FNNL has no LLM API key yet.
      Cost per token dominates here, not quality. This is the slot that decides
      whether qualifying a 40k-company TAM costs single-digit dollars or hundreds.
      WHAT THIS BLOCKS: there is no credentialed, scriptable path for TAM-scale ICP
      fit scoring, hard-no filtering or bulk field extraction. /lead-scoring and the
      classification passes in /tam-build have to run manually or inside an
      interactive Claude Code session, which does not scale to tens of thousands of
      rows and cannot be cost-governed by /api-cost-governance.
      Parallel.ai does NOT fill this. It is a research engine, not a cheap bulk
      classifier.

  copywriting:
    tool: null
    status: not_chosen
    capability: >
      Final campaign copy and nuanced analysis, where quality beats cost.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      GAP. Operator confirmed 2026-09-18 that FNNL has no LLM API key yet.
      WHAT THIS BLOCKS: /campaign-copywriting and /outreach-copywriting have no
      credentialed model to generate final copy or the per-lead personalization that
      /personalization-subagent-pattern fans out. Copy can still be written inside an
      interactive session, but it cannot be scripted, batched or cost-governed.
      Keep this slot separate from bulk_classification on purpose. The cheap model
      that scores 40k companies is not the model that should write final copy.

  image_generation:
    tool: null
    status: not_chosen
    capability: >
      Sender persona headshots and light campaign visual assets.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Not chosen, and genuinely optional. Mark n/a if FNNL supplies real photos for
      sender personas instead of generating them.

  research_routing:
    tool: null
    status: not_chosen
    capability: >
      The policy (not a tool) for which AI slot handles which research layer,
      and what each is allowed to spend.
    run_state_field: run_state.research_routing
    credentials: []
    vendor_pack: null
    notes: >
      BLOCKED until bulk_classification and copywriting are filled. A routing policy
      that can only route to one provider is not a policy.
      What IS decided: Parallel.ai handles web research (ICP, offer, account, signal
      discovery). What is undecided is which model handles cheap bulk work and which
      handles final copy, because neither is credentialed.
      Revisit with /ai-model-routing once an LLM key exists.

