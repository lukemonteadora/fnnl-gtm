    run_state_field: null
    credentials: [PARALLEL_API_KEY]
    vendor_pack: null
    notes: >
      Parallel's Search API. MAPPING INFERRED, NOT STATED: the operator named
      Parallel.ai once, as part of the stack. Assigning it to web.search follows from
      its product surface (it runs its own web-scale index built for LLM use), not
