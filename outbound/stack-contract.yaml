# =============================================================================
# FNNL AGENCY: GTM STACK CONTRACT
# =============================================================================
#
# WHAT THIS IS
# This is the single source of truth for which tool fills which job in FNNL
# Agency's cold outbound system. It shipped EMPTY on purpose, because the
# system has no default tech stack and will not guess one.
#
# FNNL'S APPROVED STACK (operator directive 2026-09-22)
# FNNL runs on SIX tools: GetLeads, AI Ark, Prospeo, MillionVerifier, Clay and
# PlusVibe. The `approved_stack` block directly below is the rule every future
# tool choice follows. Read it before recommending, activating, credentialing
# or spending on ANY tool, including ones a skill's worked example names.
#
# HOW THE SYSTEM USES IT
# Every skill in .claude/skills/ is written against a CAPABILITY ROLE ("the
# sending platform", "the contact enrichment tool"), never against a brand.
# When a skill needs a tool it reads the matching slot below. If the slot is
# still empty, the skill stops and tells you to run /stack-setup rather than
# assuming a vendor. The exception is a slot at status `retired` (see STATUS
# VALUES): it is not a gap, so no skill routes to /stack-setup to fill it.
#
# HOW TO FILL IT
# Run /stack-setup. It interviews you about FNNL's actual tools, writes the
# answers here, activates any matching integration from _vendor-library/, and
# tells you which credentials are still missing. You can also edit this file
# by hand; the format is documented at the bottom.
#
# RELATIONSHIP TO run_state
# Each client's own profile (outbound/profiles/<slug>/
# client-profile.yaml) carries a `run_state` block that locks the tools for
# THAT client's campaigns. This contract is the workspace-level answer that
# a new client's run_state inherits from. The `run_state_field` key on each
# slot below names the exact run_state field it populates. Do not rename
# those fields; 50+ skills read them by name.
#
# STATUS VALUES
#   not_chosen: FNNL has not picked a tool for this job yet (the default)
#   chosen: a tool is named but not yet credentialed or tested. On a POLICY
#         slot (tool: null, for example research_routing) it means the policy
#         is decided and recorded in `value`, but not yet proven on a real run.
#   live: credentialed and verified working against a real call
#   held: named earlier but OUTSIDE the approved six (added 2026-09-22).
#         Treat it exactly like not_chosen: it declares no capability, and it
#         is not credentialed, built against or spent on until the operator
#         approves it as an exception or clears the slot. A held slot's `tool`
#         is null, so every "slot is empty, stop" check fires as designed; the
#         tool's name is kept in `held_tool` for reference only.
#   retired: the job is no longer a purchasable slot at all (added 2026-09-22
#         by the no-AI-API rule, operator directive 2026-09-22). Claude Code
#         does the job natively (its session, sub-agents, the /deep-research
#         harness, and its built-in WebSearch and WebFetch). `tool` stays null
#         and `credentials` stays empty; nothing is credentialed, bought or
#         called for it. A retired slot is NOT a gap: a skill must not route
#         the operator to /stack-setup to fill it. The slot's notes say what
#         does the job now and keep the earlier research as history. If a
#         tool was recorded there before, its name stays in `held_tool` as
#         history only. An approved_exceptions entry cannot bring a tool
#         back into a retired slot; only a new operator directive changing
#         the no-AI-API rule can.
#   n/a: FNNL does not need this capability at all
#
# =============================================================================

meta:
  company: FNNL Agency
  slug: fnnl
  contract_version: 2
  created: 2026-09-18
  last_reviewed: 2026-09-22
  # Set to true only once every required slot is `live`. Skills may check this
  # before an expensive or outward-facing run.
  stack_locked: false

# =============================================================================
# 0. APPROVED STACK: THE SIX TOOLS, AND THE RULE FOR EVERY FUTURE CHOICE
#    Operator directive 2026-09-22 (paraphrased): these six are FNNL's only
#    tech stack, and they govern every future choice of which tool to use.
#    This block OUTRANKS every slot below. If a slot and this block disagree,
#    this block wins and the slot is the thing that is stale.
# =============================================================================

approved_stack:
  set_by: operator directive 2026-09-22
  tools:
    - tool: GetLeads
      fills: [lead_data.intent_signals]
      also_covers: >
        Deliberate SECOND source for company and contact discovery (402M
        contacts, free exact counts via count_contacts). The gap-fill to try
        when an AI Ark universe comes back thin.
      access: hosted MCP (no .env key)
    - tool: AI Ark
      fills: [lead_data.company_discovery, lead_data.contact_discovery, "lead_data.contact_enrichment (step 1)"]
      access: hosted MCP + REST, AI_ARK_API_KEY
    - tool: Prospeo
      fills: ["lead_data.contact_enrichment (gap-fill, runs only on rows AI Ark left blank)"]
      also_covers: >
        Search-time person and company filters, usable as a secondary
        discovery source when a filter AI Ark lacks decides the slice.
      access: MCP connector + REST, PROSPEO_API_KEY
    - tool: MillionVerifier
      fills: [lead_data.email_verification]
      access: local MCP (outbound/scripts/mcp/millionverifier_mcp.mjs) + REST, MILLIONVERIFIER_API_KEY
    - tool: Clay
      fills: [lead_data.list_workbench]
      access: REST + inbound webhook + MCP, CLAY_API_KEY
      constraint: >
        ZERO CLAY CREDITS, EVER, and every tool inside Clay runs on FNNL's own
        API key (HARD RULE 2026-09-22, lead_data.list_workbench.credit_policy_rule).
    - tool: PlusVibe
      fills: [infrastructure.sending_platform]
      also_covers: >
        Warmup, the reply inbox (unibox), placement tests, and a done-for-you
        domain and mailbox offering visible in its MCP tool list. That DFY
        offering is UNEVALUATED: it is the first place to look if the deferred
        infrastructure slots are ever filled from inside the six.
      access: hosted MCP + REST, PLUSVIBE_API_KEY + PLUSVIBE_WORKSPACE_ID
  rule: >
    1. SIX FIRST, ALWAYS. Any capability need, in any skill, is met by one of
       the six before anything else is considered. Before declaring a gap,
       check each tool's FULL surface (its MCP tool list and API docs), not
       only the slot it was chosen for. Several of the six cover more than
       their headline slot (see also_covers above).
    2. NOTHING OUTSIDE THE SIX WITHOUT EXPLICIT OPERATOR APPROVAL. A tool
       outside the six is never recommended as the path, activated from
       _vendor-library/, credentialed, or spent on unless the operator
       approves it by name in chat. The approval is recorded under
       approved_exceptions below, with the date and the need it fills, BEFORE
       the tool is used. A tool that appears in a worked example, in the
       credential-registry catalogue, in _vendor-library/, or as a connected
       MCP server in a session is NOT approved by that fact.
    3. LABEL OUT-OF-STACK IDEAS AS SUCH. If a skill genuinely cannot meet a
       need from the six, say so plainly, name the missing capability, and if
       an outside tool is worth raising, present it labelled "OUT OF STACK,
       needs operator approval", never as the default path.
    4. OVERLAPS RUN CHEAPEST-CAPABLE FIRST. Where two of the six can return
       the same data point, run the cheaper one across the whole set, then
       send only the still-empty cells to the next. The recorded order for
       emails is in lead_data.contact_enrichment.notes.
    5. CHANGING THE SIX takes an operator directive. Update this block first,
       then the slots, then scripts/.env.example and credential-registry.json.
    6. APPROVED IS NOT LIVE. All six are `chosen`. Each moves to `live` in its
       slot only after one real call against FNNL's own account succeeds.
  approved_exceptions:   # {tool, need, approved_on, approved_by} per entry
    - tool: OpenAI
      need: "sender headshots only (ai.image_generation)"
      approved_on: 2026-09-22
      approved_by: "operator (Luke)"
      note: >
        The one AI exception to the no-AI-API rule (operator directive
        2026-09-22). Image generation for sender persona headshots only, run
        by /mailbox-profile-generator through scripts/generate_inbox_profiles.py.
        Nothing else (research, crunch, critique, copy, other images) may use
        it. Its key is requested ONLY when the headshot step actually runs, or
        when the operator says to start setting up cold-email infrastructure.
        It is never requested or flagged as missing at onboarding, intake,
        kickoff, preflight, stack setup or workspace creation.
  held_outside_the_six: >
    Tools recorded 2026-09-18 that the operator did NOT name on 2026-09-22,
    now at status `held` in their slots, with `tool: null` and the name kept
    in `held_tool`:
    Dynadot (registrar), ScaledMail (mailbox_provider) and HeyReach
    (linkedin_outreach). They are HELD, not deleted: their slots and notes are
    kept so the research is not lost, but under rule 2 none of them is
    credentialed, built against or spent on until the operator either
    approves it as an exception or clears the slot. LeadMagic, the previous
    verifier, is REPLACED by MillionVerifier and kept only as a catalogue
    alternative in credential-registry.json.
    Parallel.ai, held the same day for research_provider, web.search and
    web.crawl, is no longer held: it is RETIRED by the no-AI-API rule
    (operator directive 2026-09-22), together with those three slots, whose
    jobs Claude Code now does natively. Its research is kept as history in
    those slots' notes.

# =============================================================================
# 1. SENDING INFRASTRUCTURE
#    Domains, mailboxes, and the platform that actually sends the campaigns.
# =============================================================================

infrastructure:

  registrar:
    tool: null
    held_tool: Dynadot
    status: held
    capability: >
      Buys and holds the cold outbound domains, and manages their DNS records
      (SPF, DKIM, DMARC, MX, tracking CNAME).
    run_state_field: run_state.registrar
    credentials: [DYNADOT_API_KEY, DYNADOT_API_SECRET]
    vendor_pack: null        # set by /stack-setup if a pack in _vendor-library/ matches
    notes: >
      HELD OUTSIDE THE APPROVED SIX (2026-09-22): not named in the operator's
      approved stack. Do not credential, build against or spend on this tool
      until the operator approves it as an exception or clears the slot. See
      approved_stack.held_outside_the_six. Research below kept for reference.
      DNS record writes ARE available via API, so domain setup is automatable.
      Current surface is REST v2, base https://api.dynadot.com/restful/v2/ .
      Register is POST /domains/{domain}/register, DNS is POST|GET|DELETE
      /domains/{domain}/records, balance is GET /accounts/info. An official MCP
      server also exists at https://mcp.dynadot.com/mcp .
      CONSTRAINTS from vendor docs, none yet proven against FNNL's own account:
      registration requires PREPAID ACCOUNT BALANCE (it fails rather than charging a
      card), an IP allowlist is available but optional, and rate limits are
      tier-gated by spend (Regular tier is 1 thread, 60 req/min). A free sandbox
      exists.
      OPEN: Dynadot's docs spell the auth signature header both X-Signature and
      Signature. Settle that in the sandbox before writing any client.
      STALE SCAFFOLD WARNING: _vendor-library/skills/domain-infra/ holds
      dynadot-zapmail and dynadot-primeforge skills built against Dynadot's OLDER
      api3.json surface, which REST v2 supersedes. Harvest the logic, do not trust
      the endpoints. Neither pairs with ScaledMail.

  mailbox_provider:
    tool: null
    held_tool: ScaledMail
    status: held
    capability: >
      Provisions the sending mailboxes on those domains, handles the Google
      Workspace / Microsoft 365 purchase, and exports them into the sending
      platform.
    run_state_field: run_state.mailbox_provider
    credentials: [SCALEDMAIL_API_KEY]
    vendor_pack: null
    notes: >
      HELD OUTSIDE THE APPROVED SIX (2026-09-22): not named in the operator's
      approved stack. Do not credential, build against or spend on this tool
      until the operator approves it as an exception or clears the slot. See
      approved_stack.held_outside_the_six. Research below kept for reference.
      Yes, they resell PRE-WARMED inboxes (POST /buy-pre-warm-inboxes), so a new
      client can launch in days rather than waiting roughly six weeks on warmup.
      That makes /mailbox-pool-staging worth standing up.
      API base https://server.scaledmail.com/api/v1, Bearer auth, key generated at
      app.scaledmail.com/settings, 5 req/sec.
      CRITICAL TIMING CONSTRAINT: ordering is self-serve via API, but FULFILLMENT IS
      MANAGED AND ASYNCHRONOUS. Their pricing page states infrastructure is built
      within 24 to 72 hours. An agent CANNOT create a mailbox synchronously. It must
      place the order, then POLL GET /domains and GET /mailboxes/{domain_id} for
      credentials. Any skill assuming same-session provisioning breaks here.
      Pull credentials via GET /mailboxes/{domain_id}, which returns email plus
      mailbox_password, and import them into the sending platform. Do NOT use their
      sequencer auto-connect block: it requires the sequencer password in plaintext
      in the request body.
      Plusvibe IS on their named compatible-platform list. Pricing read 2026-09-18:
      Google 3.50 USD per mailbox per month, Outlook 50 USD per domain per month for
      25 mailboxes, SMTP 3.75 USD per domain per month, SPF/DKIM/DMARC included.
      Minimums are not published.

  sending_platform:
    tool: Plusvibe.ai
    status: chosen
    capability: >
      Holds the campaigns, sequences, and lead lists. Sends the email, rotates
      the inboxes, runs warmup, and receives the replies. This is the most
      depended-on slot in the system.
    run_state_field: run_state.sending_platform
    credentials: [PLUSVIBE_API_KEY, PLUSVIBE_WORKSPACE_ID]
    vendor_pack: null
    notes: >
      IN THE APPROVED SIX (operator directive 2026-09-22).
      All three gates PASS on documentation review. None is yet proven on a live call.
      1. REST API for campaign create plus lead upload: YES, two-step. POST
         /campaign/add/campaign creates an empty shell taking only workspace_id and
         camp_name. PATCH /campaign/update/campaign carries the real payload:
         sequences, then steps, then variations, each variation holding its own
         subject, preheader and body, plus schedules and email_accounts. Leads go in
         via POST /lead/add.
      2. Spintax: YES. {{random|a|b|c}} and {{fallback|{{var}}|default}}, case
         insensitive. UNCONFIRMED whether spintax evaluates in SUBJECT lines. Native
         per-step subject variations with var_sel_type R_ROBIN cover that need.
      3. Programmatic reply access: YES, both directions. Webhooks fire on
         FIRST_EMAIL_REPLIES, ALL_EMAIL_REPLIES and ALL_POSITIVE_REPLIES carrying the
         reply text, HMAC-SHA256 signed when a secret is set. GET /unibox/emails
         pulls full bodies. Triage write-back via POST /lead/data/update.
         TRAP: POST /lead/update/status is sending-state control (COMPLETED, PAUSED,
         UNPAUSED), NOT triage. Triage labels go through /lead/data/update.
      Base https://api.plusvibe.ai/api/v1, header x-api-key, workspace_id required on
      every endpoint, 5 req/sec. Docs at developer.plusvibe.ai, with a
      machine-readable endpoint index at developer.plusvibe.ai/llms.txt .
      COMMERCIAL GATE: API, webhooks and MCP all require the BUSINESS plan, 77 USD
      per month minimum. The 37 USD Personal tier is not programmable at all.
      An official MCP server exists at https://mcp.plusvibe.ai/mcp but passes the API
      key as a URL QUERY PARAMETER. The REST API is the real automation surface.

  infrastructure_stack:
    tool: null
    held_tool: dynadot_scaledmail
    status: held
    capability: >
      The named combination of registrar plus mailbox provider that a given
      client's domains run on, recorded as one value so later steps can branch
      on it.
    run_state_field: run_state.infrastructure_stack
    credentials: []
    vendor_pack: null
    notes: >
      HELD OUTSIDE THE APPROVED SIX (2026-09-22): not named in the operator's
      approved stack. Do not credential, build against or spend on this tool
      until the operator approves it as an exception or clears the slot. See
      approved_stack.held_outside_the_six. Research below kept for reference.
      Derived from Dynadot plus ScaledMail. This pairing is NEW to this workspace.
      The credential registry's stack_map ships only dynadot_zapmail,
      spaceship_zapmail, dynadot_primeforge, spaceship_primeforge and
      primeforge_native, so dynadot_scaledmail has been added there.
      DEFERRED BY OPERATOR 2026-09-18. Email infrastructure will NOT be set up
      through this system for now; the operator will confirm the path later.
      Until then, treat both infrastructure slots as named-but-dormant, and do
      not route a client to any domain or mailbox setup skill. The reminder is
      enforced at /cold-email-kickoff Step 6.0, which asks the operator whether
      infra is already handled before any client setup branch runs.
      THE OPEN FORK, for when this is picked back up: WHO BUYS THE DOMAINS.
      ScaledMail's bring-your-own-domain path (provider "other") conditionally
      requires a hosting object holding the REGISTRAR USERNAME AND PASSWORD IN
      PLAINTEXT, which is full account control rather than scoped DNS access. Worse,
      Dynadot is NOT on ScaledMail's named list of supported external registrars
      (Porkbun, Namecheap, DNSimple), so that path may not even function.
      The clean alternative is provider "buy", letting ScaledMail register the
      domains, so no FNNL registrar credential ever leaves the building. That also
      means Dynadot would not be used for cold-email infrastructure.
      Do not resolve this by defaulting. It is one support question to ScaledMail.

  mailbox_mix_strategy:
    tool: null
    status: not_chosen
    capability: >
      The policy (not a tool) for how many Google Workspace versus Microsoft
      365 mailboxes to buy for a given client, based on where their prospects
      actually read mail.
    run_state_field: run_state.mailbox_mix_strategy
    credentials: []
    vendor_pack: null
    notes: See /mailbox-mix-strategy. This is a decision, so leave `tool` null.

# =============================================================================
# 2. OUTREACH CHANNELS (non-email)
#    Email lives in section 1, because the whole sending stack hangs off it.
#    This section holds the OTHER channels FNNL runs outbound on, so a campaign
#    can be multi-channel without a skill having to guess where LinkedIn lives.
#    Added 2026-09-18 on operator instruction; the contract shipped email-only.
# =============================================================================

channels:

  linkedin_outreach:
    tool: null
    held_tool: HeyReach
    status: held
    capability: >
      Runs LinkedIn connection requests and message sequences across multiple
      sender accounts, as a second outbound channel alongside email.
    run_state_field: run_state.linkedin_outreach
    credentials: [HEYREACH_API_KEY]
    vendor_pack: null
    notes: >
      HELD OUTSIDE THE APPROVED SIX (2026-09-22): not named in the operator's
      approved stack. Do not credential, build against or spend on this tool
      until the operator approves it as an exception or clears the slot. See
      approved_stack.held_outside_the_six. Research below kept for reference.
      Built for agencies and multi-account sending: connection requests,
      message sequences with conditional branching, and sender rotation across
      accounts are all confirmed.
      API base https://api.heyreach.io/api/public , header X-API-KEY, rate
      limit 300 requests per minute SHARED ORG-WIDE (not per key, so parallel
      fan-out has to budget against one pool). Create campaign, add leads and
      read replies are all confirmed. Replies come two ways and the vendor's own
      pattern is to use BOTH: a webhook push, which carries only the latest
      message, plus a REST "get chat room" pull for full history.
      Docs are a Postman collection at
      documenter.getpostman.com/view/23808049/2sA2xb5F75 . Note that
      documentation.heyreach.io does NOT resolve.
      An official remote MCP server exists, per-workspace URL and key, included
      on every paid tier including the 79 USD entry plan.
      INTEGRATION GAP THAT MATTERS: HeyReach natively integrates with Instantly,
      Smartlead and EmailBison, where email is a STEP TYPE inside the LinkedIn
      sequence rather than a data sync. PLUSVIBE IS NOT ON THAT LIST. So genuine
      interleaved email-plus-LinkedIn sequencing is NOT available out of the box
      on FNNL's chosen pairing. Running both channels means orchestrating them
      separately, or writing custom glue against both REST APIs.
      PRICING, read 2026-09-18, and widely mis-stated: the page tagline implies
      unlimited senders on a flat fee, but Growth is 79 USD PER SENDER (the card
      carries a quantity stepper). Agency 999 USD covers 25 senders, Unlimited
      2,999 USD is genuinely unlimited. Budget per sender, not per account.

# =============================================================================
# 3. LEAD DATA
#    Finding the companies, finding the people, and getting their real contact
#    details. This is where most of the money gets spent, so the ordering
#    between these slots matters as much as the tools themselves.
# =============================================================================

lead_data:

  company_discovery:
    tool: AI Ark
    status: chosen
    capability: >
      Produces the universe of target companies from an ICP definition. Could
      be a lookalike engine, a database with firmographic filters, a maps or
      directory scrape, or a public registry pull.
    run_state_field: null
    credentials: [AI_ARK_API_KEY]
    vendor_pack: null
    notes: >
      IN THE APPROVED SIX (operator directive 2026-09-22).
      AI Ark is the source-of-truth company universe: 70M+ companies with
      firmographic, technographic, funding, headcount-growth and geo filters.
      company_search is the primary call.
      MANDATORY PRE-STEP: the search enums must be resolved before filtering. Call
      industry_search, technology_search and location_search (or read the
      ark://reference/* resources) to get exact enum values. Guessed values silently
      return wrong results. When a user describes an intent like "retail", select ALL
      matching industry values, typically 5 to 20+, not one.
      Pagination: the response carries totalElements and totalPages, default size 25,
      max 100, page is 0-based. Always surface totalElements so the real match count
      is visible.
      GetLeads also does company discovery and is the deliberate SECOND source, kept
      in intent_signals rather than here so the source-of-truth layer stays single.
      If a TAM comes back thin from AI Ark, GetLeads is the gap-fill to try before
      buying a third tool.

  contact_discovery:
    tool: AI Ark
    status: chosen
    capability: >
      Finds the right people inside a target company (title, seniority,
      function, tenure) without necessarily revealing their email yet.
    run_state_field: null
    credentials: [AI_ARK_API_KEY]
    vendor_pack: null
    notes: >
      IN THE APPROVED SIX (operator directive 2026-09-22).
      people_search covers 400M to 500M profiles (vendor claim, unaudited) and
      returns titles, seniority, function and company linkage WITHOUT revealing
      email, which is exactly the cheap-qualify-before-reveal split this slot wants.
      Keep discovery and reveal separate: qualify the slice on people_search first,
      then pay for reveal only on the survivors via contact_enrichment.
      Same enum pre-step as company_discovery applies.
      GetLeads is the secondary contact source, 402M contacts with 179 fields per
      lead (52 contact, 127 company), reachable through its MCP.

  contact_enrichment:
    tool: AI Ark -> Prospeo (waterfall)
    status: chosen
    capability: >
      Reveals work email addresses, and optionally phone numbers, for the
      contacts you decided are worth paying for.
    run_state_field: run_state.tam_enrichment_path
    credentials: [AI_ARK_API_KEY, PROSPEO_API_KEY]
    vendor_pack: prospeo
    notes: >
      IN THE APPROVED SIX (AI Ark and Prospeo, operator directive 2026-09-22).
      WATERFALL ORDER, with verification interleaved per operator directive
      2026-09-18, verifier updated to MillionVerifier 2026-09-22. Mirror this
      into /email-waterfall:
        STEP 0. VERIFY FIRST any email the row already carries. Never pay a finder to
                re-discover an address one verification credit can rule on.
        STEP 1. AI Ark reveal, across the whole survivor set.
        STEP 2. MillionVerifier verify on everything step 1 returned.
        STEP 3. Prospeo, ONLY on rows AI Ark left blank or MillionVerifier rejected
                (invalid, unknown, error, disposable). A catch_all verdict is NOT
                a rejection: it goes to the holdback, not to Prospeo.
        STEP 4. MillionVerifier verify on everything step 3 returned.
      Never open Prospeo on a row AI Ark has not already attempted.
      NO SOURCE IS EXEMPT FROM RE-VERIFICATION. Both AI Ark and Prospeo verify at
      reveal time using the same third-party engine (BounceBan), and that is EXPLICITLY
      NOT the send-gate. /email-waterfall's Verification Doctrine states a finding
      tool's own internal verification is never a substitute. Every address they
      return is re-verified by MillionVerifier regardless.
      WHY AI ARK IS PRIMARY: it labels CATCH_ALL as a distinct email type alongside
      SMTP. Prospeo's status field is binary (VERIFIED / UNAVAILABLE) and therefore
      COLLAPSES catch-all into valid; its verification_method field (SMTP / BOUNCEBAN)
      recovers the signal, so any pipeline reading Prospeo output MUST read
      verification_method, not status alone.
      KEEP AI ARK'S CATCH_ALL LABEL AS A COLUMN. It is not the send-gate
      (MillionVerifier's catch_all result is), but it is an independent second
      catch-all signal from reveal time, useful when the two disagree.
      USE THE RIGHT AI ARK ENDPOINT: route gap-fill through /v1/people/email-finder,
      which charges 0 credits when no valid email is found. The bulk
      /v1/people/export path bills 0.5 credits PER PROFILE EVEN ON A MISS (vendor's
      worked example: 1,000 rows costs 500 credits whether 700 or 1,000 resolve).
      COST EVIDENCE IS ASYMMETRIC, DO NOT CLAIM CHEAPEST-FIRST IS SATISFIED YET:
      AI Ark's pricing is vendor-confirmed, Prospeo's is third-party only (reported as
      39 / 99 / 199 / 369 USD, UNCONFIRMED, their pricing page is JavaScript-rendered).
      Read Prospeo's real pricing from a logged-in account before treating this
      ordering as cost-optimal. The catch-all rationale above holds regardless.
      Prospeo charges nothing when no result is found, offers free re-enrichment
      within 90 days, and its bulk limit is 50 persons per request. Its enrich-person
      endpoint takes linkedin_url, but the documented minimum match is name plus a
      company identifier, so LinkedIn-URL-alone is UNPROVEN.

  email_verification:
    tool: MillionVerifier
    status: chosen
    capability: >
      Confirms a revealed address will actually accept mail, and flags
      catch-all domains, before that address ever enters a campaign.
    run_state_field: null
    credentials: [MILLIONVERIFIER_API_KEY]
    vendor_pack: null
    notes: >
      IN THE APPROVED SIX. Operator directive 2026-09-22: MillionVerifier is
      FNNL's verifier of record, REPLACING LeadMagic (chosen 2026-09-18). It runs
      BETWEEN each stage of the enrichment waterfall, which is already law in
      /email-waterfall's Verification Doctrine ("the email verifier is the
      UNIVERSAL VERIFIER OF RECORD; there are NO source exemptions").
      CATCH-ALL: RESOLVED BY THE SWAP. The previous verifier's current API had no
      catch-all status (accept-all domains came back as `unknown`), which left
      /email-waterfall's Catch-All Timing gate without a discriminator and
      needed a control test to settle. MillionVerifier returns catch-all as its
      OWN result: resultcode 1=ok, 2=catch_all, 3=unknown, 4=error,
      5=disposable, 6=invalid. So one call gives both deliverability and the
      catch-all flag, which is exactly the two-in-one verifier /email-waterfall
      asks for. Gate mapping: ok goes to `valid` (the send file); catch_all goes
      to the holdback (leads.catchall-holdback.csv, reintroduced after domain
      maturity); unknown, error, disposable and invalid go to the review queue
      or the gap-fill step. NEVER collapse catch_all into ok or into unknown.
      WHAT IT DOES NOT DO: it labels a catch-all domain, it cannot tell you
      whether that specific mailbox exists. That is the nature of accept-all
      domains, not a MillionVerifier defect. AI Ark's reveal-time CATCH_ALL
      label stays a preserved second signal; keep it as its own column.
      ACCESS: MillionVerifier publishes no MCP server, so this workspace wraps
      its REST API in a local, dependency-free MCP server at
      outbound/scripts/mcp/millionverifier_mcp.mjs (registered in .mcp.json).
      It reads MILLIONVERIFIER_API_KEY from outbound/scripts/.env itself, so no
      key ever lands in a tracked file. Set the key with
      outbound/scripts/setup-millionverifier-key.ps1. Tools: real-time verify,
      credits, and bulk upload / status / download / stop. The vendor's API
      takes the key as a URL query parameter (their design).
      PROVEN SO FAR (2026-09-22): only the plumbing and a real-time round trip
      using the vendor's public TEST key. Credits and every bulk call have NOT
      yet succeeded on a real FNNL account, which is why the status is `chosen`.
      First live proof: millionverifier_get_credits (free) on FNNL's own key.
      COST: credits per verification, deducted per real-time call. The bulk
      per-email rate is NOT confirmed, so /api-cost-governance prices a bulk
      job before it runs. Paid calls auto-approve only inside the standing $100
      client budget (spend_ceiling_usd); anything over it is confirmed first.
      UNVERIFIED, check before building the Clay path: whether Clay offers
      MillionVerifier as a NATIVE column (with bring-your-own-key) or whether it
      has to be reached through an HTTP API column or pushed in by webhook. Do
      not assume either until it is looked up in FNNL's Clay workspace.
      RETIRED: LeadMagic. Its research (billing, OpenAPI findings, the
      Clay-layer catch-all theory) stays in credential-registry.json's
      leadmagic entry and in git history. It is not in the stack.

  intent_signals:
    tool: GetLeads
    status: chosen
    capability: >
      Third-party buying-intent or technographic data that says a company is
      in-market right now, as opposed to merely fitting the ICP.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      IN THE APPROVED SIX (operator directive 2026-09-22).
      Credentials are empty ON PURPOSE: GetLeads authenticates by OAuth through its
      MCP server at https://app.getleads.io/api/mcp , roughly 45 tools, so there is
      no .env key. A REST API exists but has NO public documentation
      (docs.getleads.io does not resolve), so the MCP is the only supported surface.
      HONEST SCOPE: this is NOT third-party buying-intent data. There is no Bombora,
      G2 or 6sense here. What GetLeads gives is (a) company state attributes you
      filter on, namely funding, hiring, headcount, technographics and traffic, and
      (b) genuine live scrapes: website-visitor identification pixels, LinkedIn
      post-engager monitoring and company-follower scrapes. list_funding_signals and
      list_acquisition_signals exist as tools.
      Treat funding and hiring as filters, not as real-time event alerts, unless a
      test proves recency.
      BILLING MODEL, TWO SEPARATE BALANCES, DO NOT CONFLATE THEM:
        PLAN CREDITS cover search, export and enrich. Free tier 1,000 credits,
        Partner 249 USD/mo, Unlimited 497 USD/mo. "Unlimited" is still governed by a
        daily and monthly fair-use budget.
        PREPAID WALLET CASH covers only the live scrapes, for example website-visitor
        identification at a published 0.125 USD per newly identified lead.
      An empty wallet returns insufficient_wallet_cash while search and export keep
      working normally. NEVER report "out of credits" on a wallet failure; that would
      ship a false outage.
      OPEN QUESTION WORTH ASKING THE VENDOR: the MCP surface exposes more than the
      marketing site advertises, including acquisition signals that appear nowhere
      publicly, and the site still lists post-engagement as COMING SOON while the
      tool already exists. Confirm those are supported before building a campaign on
      them. The payload shape, recency and upstream source of the funding and
      acquisition signals are UNKNOWN; only tool existence is established.

  list_workbench:
    tool: Clay
    status: chosen
    capability: >
      The visible, human-editable surface the working lead list lives on:
      rows, columns, tabs, enrichment steps, and manual correction. Where the
      operator can see and steer the list instead of only receiving a CSV.
    run_state_field: run_state.list_workbench
    credentials: [CLAY_API_KEY]
    vendor_pack: null
    credit_policy: zero_clay_credits   # HARD RULE, operator directive 2026-09-22. Full text below.
    credit_policy_rule: >
      HARD RULE, operator directive 2026-09-22. FNNL NEVER runs anything in Clay
      that consumes Clay credits. Clay is where lead lists are BUILT AND WATCHED,
      never a data vendor FNNL pays through Clay's own balance.
      1. BUILD LEAD LISTS IN CLAY BY DEFAULT. Whenever a lead list is built, it
         lives in a Clay table so the operator watches it fill live, instead of a
         CSV assembled blind in Claude Code. The session pushes each stage's rows
         into the client's tables by inbound webhook (build_protocol below). The
         local CSVs stay the working copy the downstream skills read, because
         Clay's API cannot read a table back below its top plan tier; operator
         edits made in the table come back by manual export before upload. A
         CSV-only build is the fallback only while the client's table and webhook
         are not ready, and the session says so.
      2. ZERO CLAY DATA CREDITS, EVER. Banned outright: Clay's own enrichments and
         data providers running on Clay's account instead of FNNL's key, Clay's
         own email and phone waterfalls on Clay credits, Claygent and AI columns
         on Clay's AI credits, Clay's built-in people and company search wherever
         it bills credits, and the Clay MCP's search, enrich and subroutine tools
         (whichever generation the connector exposes: search-companies,
         search-contacts, search-contacts-by-name, find-and-enrich-company,
         find-and-enrich-contacts-at-company, find-and-enrich-list-of-contacts,
         add-company-data-points, add-contact-data-points, run_subroutine,
         run_subroutine_direct). A non-zero spend_ceiling_usd, auto_execute, or an
         approved_exceptions entry NEVER authorizes Clay credits. Only a new,
         explicit operator directive that changes this rule can.
      3. EVERY TOOL INSIDE CLAY RUNS ON FNNL'S OWN API KEY. Any enrichment column
         (native integration or HTTP API column) is connected with FNNL's own key
         for a tool in the approved six (for example GetLeads or Prospeo). A tool
         outside the six (for example BlitzAPI) first needs operator approval
         under approved_stack rule 2, and then also runs on FNNL's own key. If a
         tool cannot be keyed inside Clay (no bring-your-own-key option, or the
         HTTP API column is plan-gated), call it OUTSIDE Clay with FNNL's key and
         push the finished rows in by webhook. Never fall back to Clay credits
         because a key is missing, rate-limited or failing: stop and report.
      4. DEFAULT-DENY WHAT IS UNPROVEN. Any Clay action, column or MCP tool whose
         billing has not been verified as zero-credit is treated as
         credit-consuming and is not run. Before a keyed column runs on a full
         table: confirm its account setting shows FNNL's own key, run it on 1 to 5
         rows, and read the Clay credit balance before and after. Any drop means
         stop and report.
      5. THE SECOND METER, ACTIONS. Bring-your-own-key removes Clay DATA CREDITS
         but still consumes Clay ACTIONS, the plan's platform-usage allowance (see
         TWO METERS in the notes). The operator's directive allows keyed tools
         inside Clay, so Actions are allowed, but they are still spend and route
         through /api-cost-governance like any paid call. Prefer the zero-meter
         path whenever it gives the same result: enrich outside Clay with FNNL's
         keys and push rows in by inbound webhook. Webhook import, viewing, manual
         edits, formulas, filters and CSV export cost zero Actions and zero
         credits.
      6. WHAT THE SESSION MAY CALL ON THE CLAY MCP: only free metadata and read
         calls (get-current-workspace, list_subroutines, get-task,
         get-task-context). Everything else on that connector falls under rule 4.
         The session cannot create tables or columns in Clay, so the operator
         builds or duplicates the client's table in the Clay UI with an
         inbound-webhook source and records the webhook URL in the client's
         gitignored profile, never in a tracked file.
    build_protocol: >
      HOW A LIST BUILD USES CLAY (operator directive 2026-09-22; wired into
      /tam-build, /lead-scoring and /email-waterfall; tool scripts/workbench_push.mjs).
      TABLES, one per row version so no table ever holds two versions of a row:
      companies (list_stage sample, then company_tam), contacts (contact_tam),
      scored (scored), and one send list per campaign (verified). The operator
      creates each in the Clay UI with an inbound-webhook source, TURNS AUTO-RUN OFF,
      and records it in the client's gitignored client-profile.yaml:
        list_workbench_tables:
          companies: { webhook_url: "", ready: false, auto_run_off: false }
          contacts:  { webhook_url: "", ready: false, auto_run_off: false }
          scored:    { webhook_url: "", ready: false, auto_run_off: false }
          send_lists:
            <campaign-slug>: { webhook_url: "", ready: false, auto_run_off: false }
      Optional per table: auth_header (the header name exactly as Clay's cURL
      example shows it; Clay's docs do not name it) and auth_token_env (the
      scripts/.env variable holding the token).
      READY means ready: true AND auto_run_off: true AND an https webhook_url. The
      script checks all three and exits 3 otherwise; the skill then builds CSV-only
      and says "list workbench not ready: built CSV-only" at the top of its report.
      WHY AUTO-RUN MUST BE OFF (verified in Clay's docs, 2026-09-22): the webhook
      import itself costs zero credits and zero Actions, but auto-run is ON by
      default and fires every enrichment column on each arriving row, which spends
      credits. Keyed columns are run deliberately after an /api-cost-governance
      preview and the 1-to-5-row credit test, never by auto-run.
      HOW PUSHING BEHAVES (Clay docs, 2026-09-22): one POST makes one row (arrays are
      not split); Content-Type must be application/json or the row lands empty;
      about 10 requests per second per WORKSPACE (the script paces at 8); 100 KB per
      row; a 429 drops the row (the script retries); 50,000 lifetime submissions
      per webhook source, then 403 and a new webhook source is needed; there is NO
      upsert, so a re-push appends duplicates. The script refuses to re-push the
      same CSV to the same table (exit 4, --force overrides), writes rows that did
      not land to profiles/<slug>/workbench/failed-*.csv so a retry pushes only
      those, and logs every push to profiles/<slug>/workbench/push-log.jsonl
      (never the webhook URL). Every row gets list_stage, pushed_at, push_id and
      push_row columns.
      PLAN GATE, UNVERIFIED FOR FNNL: Clay's docs say inbound webhooks need the
      Growth plan or higher. FNNL's Clay plan tier is not recorded. If webhooks are
      unavailable, the fallback is a manual CSV import into the table (also free),
      which gives the view but not the live fill.
      THE CSV STAYS THE WORKING COPY. Downstream skills read the local CSVs, because
      the Clay API cannot read a table back below Enterprise. Operator edits made in
      Clay come back only by manual export, which replaces the local file; an edited
      send list is treated as a new send file (unverified emails re-verified,
      /list-quality-scorecard re-run) before upload.
      VERIFY every push: report "pushed N/N rows to <table> (list_stage=<x>)". A
      shortfall goes at the top of the report and is retried once with the
      failed-rows CSV, never with a full --force re-push.
    notes: >
      IN THE APPROVED SIX (operator directive 2026-09-22).
      Operator directive 2026-09-18/19: FNNL already uses Clay this way, and as of
      2026-09-19 Clay is where the operator WORKS the lead list. Because nothing
      below Enterprise can read a Clay table back, the local CSV is the machine
      working copy and Clay is the live view and editing surface (see
      build_protocol and WHAT CANONICAL MEANS HERE). Clay is the frame, not the
      data vendor: FNNL's own tools (AI Ark, Prospeo, MillionVerifier,
      GetLeads) do the enrichment through Clay columns or are pushed in by webhook.
      Clay's OWN data enrichments (its credits, its waterfall providers) are
      PROHIBITED OUTRIGHT by credit_policy_rule above. An approved_exceptions entry
      cannot authorize them.
      WHAT CANONICAL MEANS HERE, and what it costs. Because an agent cannot read a
      Clay table back below Enterprise (READ-BACK CONSTRAINT below), the CSV paths
      the skill library reads (tam/tam.csv, contacts.csv, leads.verified.csv) stay
      the machine working copy, and Clay is the operator's live view and editing
      surface. WIRED 2026-09-22: /tam-build, /lead-scoring and /email-waterfall push
      every stage into the client's tables per build_protocol above. Operator edits
      in Clay flow back only by a manual CSV export that replaces the local file
      before upload; that boundary is the one step not automated.
      WORKSPACE: Dorsia Labs, ID 651677, operator-confirmed as FNNL's workspace on
      2026-09-22 and re-checked live with get-current-workspace the same day. Before
      that the connector was pinned to a-sales.co (ID 161971), the PREVIOUS company's
      workspace. Never build a client list in 161971. The connector is a claude.ai
      account-level connection, so the workspace is whichever one the operator
      authorizes at sign-in: run get-current-workspace (free) before any Clay work
      and stop if it does not return 651677.
      THE MCP IS THE WRONG SURFACE FOR TABLE WORK, verified against the live tool
      manifest in session. The connector has exposed two tool generations
      (search-companies / search-contacts / add-*-data-points / run_subroutine, and
      after a 2026-09-22 reconnect find-and-enrich-*). Neither has create-table,
      add-column, read-rows or update-cell. Everything hangs off an ephemeral search
      taskId, not a Clay table. Its five subroutines are Clay's OWN enrichments,
      which spend Clay credits, so pointing an agent at the MCP is more likely to
      SPEND credits than to save them. ENFORCED IN CODE since 2026-09-22: the project
      hook .claude/hooks/clay-credit-guard.mjs (wired in .claude/settings.json)
      blocks every connector tool except the four free read calls, plus the known
      credit-spending tool names on any server. It is a backstop for Claude Code
      only; it cannot see columns run inside the Clay web app.
      THE SURFACES THAT DO WORK: an INBOUND WEBHOOK to push rows into a table
      (consumes ZERO Actions), and the Routines API (POST /routines/{id}/run) to
      invoke saved logic. Public REST base https://api.clay.com/public/v0 , header
      clay-api-key.
      TWO METERS, correcting a common assumption: Clay bills ACTIONS (platform
      orchestration, tenths of a penny) SEPARATELY from DATA CREDITS (vendor data,
      pennies). Bring-your-own-key removes the DATA CREDITS but NOT the Actions.
      Clay's own wording: "Using your own API keys (still counts as platform usage)"
      and "an Action will still be consumed." Nothing inside Clay enriches for free,
      including the HTTP API column. Webhook import, viewing, manual editing,
      formulas, filters and CSV export DO cost zero Actions.
      NATIVE vs HTTP COLUMN: Prospeo is a NATIVE Clay integration with
      bring-your-own-key. Whether MillionVerifier is native is UNVERIFIED (see
      email_verification.notes). AI ARK IS NOT NATIVE, so reaching it from Clay
      needs an HTTP API column, which requires Clay's GROWTH plan (~446 USD/mo). With
      Clay canonical that cost is now on the critical path, not optional. The
      alternative is calling AI Ark from a script and pushing results in by webhook,
      which is free of Actions.
      THE READ-BACK CONSTRAINT, the one real risk to Clay-canonical: below Clay's
      ENTERPRISE tier there is no general "read current table state" call. Public-API
      Tables are read-only AND Enterprise-gated ("not create tables, add fields, or
      write records"). So an agent can write rows IN but cannot read back what the
      sheet says after enrichment and human edits. With Clay canonical, the boundary
      OUT is therefore a manual CSV export, an HTTP column POSTing outward (1 Action
      per row, Growth+), or Routines results. Accepted deliberately: the operator
      wants visibility and manual control over blind CSV handoffs, and a
      human-in-the-loop export at the upload boundary is the price of that.
      Worth reading before building anything custom: the clay-workflows and
      clay-prompt skills in the anthropic-skills plugin set.

