# =============================================================================
# FNNL AGENCY: GTM STACK CONTRACT
# =============================================================================
#
# WHAT THIS IS
# This is the single source of truth for which tool fills which job in FNNL
# Agency's cold outbound system. It ships EMPTY on purpose. The system has no
# default tech stack and will not guess one.
#
# HOW THE SYSTEM USES IT
# Every skill in .claude/skills/ is written against a CAPABILITY ROLE ("the
# sending platform", "the contact enrichment tool"), never against a brand.
# When a skill needs a tool it reads the matching slot below. If the slot is
# still empty, the skill stops and tells you to run /stack-setup rather than
# assuming a vendor.
#
# HOW TO FILL IT
# Run /stack-setup. It interviews you about FNNL's actual tools, writes the
# answers here, activates any matching integration from _vendor-library/, and
# tells you which credentials are still missing. You can also edit this file
# by hand; the format is documented at the bottom.
#
# RELATIONSHIP TO run_state
# Each client's own profile (outbound/profiles/<slug>/
# client-profile.yaml) carries a `run_state` block that locks the tools for
# THAT client's campaigns. This contract is the workspace-level answer that
# a new client's run_state inherits from. The `run_state_field` key on each
# slot below names the exact run_state field it populates. Do not rename
# those fields; 50+ skills read them by name.
#
# STATUS VALUES
#   not_chosen: FNNL has not picked a tool for this job yet (the default)
#   chosen: a tool is named but not yet credentialed or tested
#   live: credentialed and verified working against a real call
#   n/a: FNNL does not need this capability at all
#
# =============================================================================

meta:
  company: FNNL Agency
  slug: fnnl
  contract_version: 1
  created: 2026-09-18
  last_reviewed: null
  # Set to true only once every required slot is `live`. Skills may check this
  # before an expensive or outward-facing run.
  stack_locked: false

# =============================================================================
# 1. SENDING INFRASTRUCTURE
#    Domains, mailboxes, and the platform that actually sends the campaigns.
# =============================================================================

infrastructure:

  registrar:
    tool: null
    status: not_chosen
    capability: >
      Buys and holds the cold outbound domains, and manages their DNS records
      (SPF, DKIM, DMARC, MX, tracking CNAME).
    run_state_field: run_state.registrar
    credentials: []          # e.g. [REGISTRAR_API_KEY, REGISTRAR_API_SECRET]
    vendor_pack: null        # set by /stack-setup if a pack in _vendor-library/ matches
    notes: >
      Whoever you pick must expose DNS record writes via API, or every domain
      setup becomes a manual click-through. Confirm that before committing.

  mailbox_provider:
    tool: null
    status: not_chosen
    capability: >
      Provisions the sending mailboxes on those domains, handles the Google
      Workspace / Microsoft 365 purchase, and exports them into the sending
      platform.
    run_state_field: run_state.mailbox_provider
    credentials: []
    vendor_pack: null
    notes: >
      Ask whether they resell pre-warmed mailboxes. That single answer decides
      whether a new client launches in days or in roughly six weeks, and it
      drives whether /mailbox-pool-staging is worth standing up.

  sending_platform:
    tool: null
    status: not_chosen
    capability: >
      Holds the campaigns, sequences, and lead lists. Sends the email, rotates
      the inboxes, runs warmup, and receives the replies. This is the most
      depended-on slot in the system.
    run_state_field: run_state.sending_platform
    credentials: []
    vendor_pack: null
    notes: >
      Check three things before locking this: does it have a REST API for
      campaign create plus lead upload, does it support spintax, and can it
      expose replies programmatically. Without the first, campaign upload stays
      manual. Without the third, reply scoring cannot be automated.

  infrastructure_stack:
    tool: null
    status: not_chosen
    capability: >
      The named combination of registrar plus mailbox provider that a given
      client's domains run on, recorded as one value so later steps can branch
      on it.
    run_state_field: run_state.infrastructure_stack
    credentials: []
    vendor_pack: null
    notes: Derived from registrar + mailbox_provider once both are chosen.

  mailbox_mix_strategy:
    tool: null
    status: not_chosen
    capability: >
      The policy (not a tool) for how many Google Workspace versus Microsoft
      365 mailboxes to buy for a given client, based on where their prospects
      actually read mail.
    run_state_field: run_state.mailbox_mix_strategy
    credentials: []
    vendor_pack: null
    notes: See /mailbox-mix-strategy. This is a decision, so leave `tool` null.

# =============================================================================
# 2. LEAD DATA
#    Finding the companies, finding the people, and getting their real contact
#    details. This is where most of the money gets spent, so the ordering
#    between these slots matters as much as the tools themselves.
# =============================================================================

lead_data:

  company_discovery:
    tool: null
    status: not_chosen
    capability: >
      Produces the universe of target companies from an ICP definition. Could
      be a lookalike engine, a database with firmographic filters, a maps or
      directory scrape, or a public registry pull.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      This is the source-of-truth signal layer. Do not let a contact-enrichment
      tool stand in for it; finding a person at a company is a different job
      from deciding the company belongs on the list at all.

  contact_discovery:
    tool: null
    status: not_chosen
    capability: >
      Finds the right people inside a target company (title, seniority,
      function, tenure) without necessarily revealing their email yet.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Keeping discovery separate from reveal is what lets you qualify a slice
      cheaply before paying per contact.

  contact_enrichment:
    tool: null
    status: not_chosen
    capability: >
      Reveals work email addresses, and optionally phone numbers, for the
      contacts you decided are worth paying for.
    run_state_field: run_state.tam_enrichment_path
    credentials: []
    vendor_pack: null
    notes: >
      If you use more than one, record the waterfall order here and in
      /email-waterfall. The exhaust-cheapest-first rule only saves money when
      the order is written down and actually followed.

  email_verification:
    tool: null
    status: not_chosen
    capability: >
      Confirms a revealed address will actually accept mail, and flags
      catch-all domains, before that address ever enters a campaign.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Ask explicitly whether it detects catch-all as a separate signal from
      valid/invalid. A verifier that collapses the two will quietly inflate
      your bounce rate.

  intent_signals:
    tool: null
    status: not_chosen
    capability: >
      Third-party buying-intent or technographic data that says a company is
      in-market right now, as opposed to merely fitting the ICP.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Genuinely optional. Mark `n/a` if FNNL is not buying intent data, so the
      skills stop offering it as a path.

# =============================================================================
# 3. AI AND RESEARCH
#    The models that research, classify, and write. Splitting these slots is
#    deliberate: the cheapest model that can do bulk classification is almost
#    never the model you want writing final copy.
# =============================================================================

ai:

  research_provider:
    tool: null
    status: not_chosen
    capability: >
      Primary web research engine for ICP, offer, and account research. Should
      return sourced, citable answers rather than unattributed prose.
    run_state_field: run_state.ai_research_provider
    credentials: []
    vendor_pack: null
    notes: null

  bulk_classification:
    tool: null
    status: not_chosen
    capability: >
      Cheap, high-volume classification and extraction at TAM scale (ICP fit
      scoring, hard-no filtering, field extraction across thousands of rows).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Cost per token matters far more than quality here. This is the slot that
      decides whether qualifying a 40k-company TAM costs dollars or hundreds.

  copywriting:
    tool: null
    status: not_chosen
    capability: >
      Final campaign copy and nuanced analysis, where quality beats cost.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: null

  image_generation:
    tool: null
    status: not_chosen
    capability: >
      Sender persona headshots and light campaign visual assets.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: Optional. Mark `n/a` if FNNL supplies real photos instead.

  research_routing:
    tool: null
    status: not_chosen
    capability: >
      The policy (not a tool) for which AI slot handles which research layer,
      and what each is allowed to spend.
    run_state_field: run_state.research_routing
    credentials: []
    vendor_pack: null
    notes: See /ai-model-routing. This is a decision, so leave `tool` null.

# =============================================================================
# 4. WEB ACCESS
# =============================================================================

web:

  search:
    tool: null
    status: not_chosen
    capability: Programmatic search results (web, news, places) for research and discovery.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: null

  crawl:
    tool: null
    status: not_chosen
    capability: Website crawling and content extraction for company research and signal detection.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: null

# =============================================================================
# 5. OPERATIONS
#    Where the results land and how the team sees them.
# =============================================================================

operations:

  crm:
    tool: null
    status: not_chosen
    capability: >
      Holds leads, opportunities, and activity history once a reply turns into
      a real conversation.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Confirm who owns the CRM. If it is the client's CRM rather than FNNL's,
      the integration and the data-handling rules both change.

  reporting_destination:
    tool: null
    status: not_chosen
    capability: >
      Where recurring campaign reporting is delivered (a chat workspace, an
      email digest, a shared dashboard).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: null

  document_generation:
    tool: null
    status: not_chosen
    capability: >
      Produces the client-facing deliverables: approval briefs, campaign
      sequence presentations, follow-up decks.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      The repo ships working DOCX and PPTX builders under
      outbound/scripts/. If FNNL wants Google Docs or
      Notion instead, that is a swap here.

  spreadsheet:
    tool: null
    status: not_chosen
    capability: >
      Shared tracking surfaces (mailbox inventory, per-client inbox and cost
      tracking, pool staging).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      /mailbox-pool-staging expects two sheets and currently holds
      <FNNL_MAILBOX_POOL_SHEET_ID> and <FNNL_MAILBOX_TRACKER_SHEET_ID> as
      placeholders. Create the sheets, then replace those placeholders.

# =============================================================================
# 6. EXECUTION DEFAULTS
#    Not tools. These are the workspace-level safety settings a new client's
#    run_state inherits. The defaults below are deliberately conservative:
#    nothing spends and nothing runs unattended until you say otherwise.
# =============================================================================

execution_defaults:

  execution_mode: review_gates      # review_gates | auto_execute
  run_state_field_execution_mode: run_state.execution_mode
  spend_ceiling_usd: 0              # 0 means confirm before every paid call
  run_state_field_spend_ceiling: run_state.spend_ceiling_usd
  notes: >
    Raise these only on an explicit instruction from the operator, never
    silently. auto_execute with a non-zero ceiling lets the system spend money
    without asking, so it should be a deliberate decision per client.

# =============================================================================
# 7. FNNL AGENCY PROCESS OVERRIDES
#    The system ships with a default cold outbound process. Where FNNL's own
#    process differs, record it here so the skills follow FNNL's way rather
#    than the inherited default. Leave empty until you have actually confirmed
#    how FNNL works; an invented process is worse than no override.
# =============================================================================

process_overrides:

  client_onboarding_steps: null     # FNNL's own onboarding sequence, if different
  approval_gates: null              # what FNNL requires client sign-off on, and when
  campaign_naming_convention: null  # how FNNL names campaigns across clients
  reporting_cadence: null           # how often clients get reporting, in what format
  deliverable_format: null          # what FNNL actually hands a client
  copy_review_policy: null          # who reviews copy before it goes live
  notes: >
    /stack-setup asks about these. Anything left null means the system uses
    its built-in default, which is documented in the matching skill.

# =============================================================================
# FORMAT REFERENCE (for hand-editing)
# =============================================================================
#
# A filled slot looks like this:
#
#   sending_platform:
#     tool: "Instantly"
#     status: live
#     capability: >
#       (leave the shipped wording, it describes the job not the tool)
#     run_state_field: run_state.sending_platform
#     credentials: [INSTANTLY_API_KEY]
#     vendor_pack: null
#     notes: >
#       Verified 2026-09-20 against a real campaign-create call.
#
# After editing by hand:
#   1. Add any new credential names to scripts/.env.example (names only, never
#      real key values).
#   2. Put the real values in scripts/.env, which is gitignored.
#   3. Run /preflight-credentials to confirm the keys resolve.
#
# =============================================================================
