    run_state_field: null
    # Deliberately empty. The headshot key is requested only when the
    # headshot step runs or cold-email infrastructure setup starts, so it must
    # never appear here, where stack setup or preflight could flag it missing.
    credentials: []
    vendor_pack: null
    notes: >
      THE ONE AI EXCEPTION to the no-AI-API rule: OpenAI, headshots only,
