      (campaign-approval-brief, cold-email-campaign-sequence-docx-presentation,
      cold-email-followups-docx-presentation, interested-replies-docx-presentation)
      and need no credential.
      NOT YET PROVEN against an FNNL deliverable. They ran in the upstream workspace,
      so treat them as a working scaffold until one brief is generated end to end.

  spreadsheet:
    tool: null
    status: not_chosen
    capability: >
      Shared tracking surfaces (mailbox inventory, per-client inbox and cost
      tracking, pool staging).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Not chosen. The operator's stack list did not name a spreadsheet tool.
      NOTE, not a decision: a google-docs MCP server is already connected at the user
      level of this machine and covers docs, drive and sheets. If FNNL wants Google
      Sheets here, that connection likely satisfies it with no new purchase, but it
      has not been verified against an FNNL-owned Drive and is not recorded as chosen
      on that basis.
      WHAT THIS BLOCKS: /mailbox-pool-staging expects two sheets and still holds
      <FNNL_MAILBOX_POOL_SHEET_ID> and <FNNL_MAILBOX_TRACKER_SHEET_ID> as
      placeholders. Until a spreadsheet surface is chosen and those IDs are filled,
      mailbox pool staging cannot run.

# =============================================================================
# 7. EXECUTION DEFAULTS
#    Not tools. These are the workspace-level safety settings a new client's
#    run_state inherits. The defaults below are deliberately conservative:
#    nothing spends and nothing runs unattended until you say otherwise.
# =============================================================================

execution_defaults:

  execution_mode: review_gates      # review_gates | auto_execute
  run_state_field_execution_mode: run_state.execution_mode
  spend_ceiling_usd: 0              # 0 means confirm before every paid call
  run_state_field_spend_ceiling: run_state.spend_ceiling_usd
  notes: >
    Raise these only on an explicit instruction from the operator, never
    silently. auto_execute with a non-zero ceiling lets the system spend money
    without asking, so it should be a deliberate decision per client.
    CONFIRMED BY OPERATOR 2026-09-18: hold the ceiling at 0 and stay on
    review_gates until each tool has made one verified call from this
    workspace. Reason given: none of the eight chosen tools is proven here yet,
    and several bill per record (AI Ark per credit, Prospeo per reveal,
    GetLeads wallet cash per scrape), so an unattended misconfigured query
    could burn real money before anyone sees it. Revisit per tool as each one
    reaches status: live, not as a single blanket change.

# =============================================================================
# 8. FNNL AGENCY PROCESS OVERRIDES
#    The system ships with a default cold outbound process. Where FNNL's own
#    process differs, record it here so the skills follow FNNL's way rather
#    than the inherited default. Leave empty until you have actually confirmed
#    how FNNL works; an invented process is worse than no override.
# =============================================================================

process_overrides:

  client_onboarding_steps: null     # FNNL's own onboarding sequence, if different
  approval_gates: null              # what FNNL requires client sign-off on, and when
  campaign_naming_convention: null  # how FNNL names campaigns across clients
  reporting_cadence: null           # how often clients get reporting, in what format
  deliverable_format: null          # what FNNL actually hands a client
  copy_review_policy: null          # who reviews copy before it goes live
  notes: >
    /stack-setup asks about these. Anything left null means the system uses
    its built-in default, which is documented in the matching skill.
    ACCOUNT OWNERSHIP, confirmed by operator 2026-09-18: FNNL OWNS EVERYTHING.
    FNNL buys the domains and inboxes and runs every client inside its own
    Plusvibe, ScaledMail and HeyReach accounts. Clients are tenants, not
    account holders. Consequences the skills should assume: one credential set
    covers all clients rather than per-client keys; domain and sending
    reputation is FNNL's asset to protect, so one client's bad list damages
    other clients' deliverability; and a departing client cannot take the
    infrastructure with them, which is a commercial conversation to have at
    offboarding rather than a technical one.
    Everything else above is still null and therefore still on the built-in
    default. approval_gates in particular is the one most likely to differ per
    agency and is client-visible when wrong, so capture it before the first
    client deliverable ships.

