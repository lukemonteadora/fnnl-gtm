# =============================================================================
# 7. EXECUTION DEFAULTS
#    Not tools. These are the workspace-level settings a new client's
#    run_state inherits. The mode default is conservative (review_gates).
#    Spend runs on a standing budget per client run that is never asked.
# =============================================================================

execution_defaults:

  execution_mode: review_gates      # review_gates | auto_execute
  run_state_field_execution_mode: run_state.execution_mode
  spend_ceiling_usd: 100            # standing budget per client run, never asked (operator directive 2026-09-22)
  run_state_field_spend_ceiling: run_state.spend_ceiling_usd
  notes: >
    STANDING SPEND BUDGET (operator directive 2026-09-22): every client run
    gets spend_ceiling_usd = 100, written automatically and never asked at
    onboarding, intake, kickoff or run start. Paid data steps inside it run
    without a confirmation, a purchase that would push the run over it stops
    and asks, and each new wave starts a fresh $100. Mailbox infrastructure
    (domains, mailbox capacity) is outside the budget and still needs the
    operator's approval of the setup total. Change a client's figure, or the
    execution_mode, only on an explicit operator instruction, never silently.
    HISTORY, CONFIRMED BY OPERATOR 2026-09-18 (the spend half was superseded on
    2026-09-22 by the standing budget above; the review_gates half stands):
    hold the ceiling at 0 and stay on review_gates until each tool has made
    one verified call from this workspace. Reason given: none of the eight
    chosen tools is proven here yet, and several bill per record (AI Ark per
    credit, Prospeo per reveal, GetLeads wallet cash per scrape), so an
    unattended misconfigured query could burn real money before anyone sees
    it. Revisit per tool as each one reaches status: live, not as a single
    blanket change.

# =============================================================================
# 8. FNNL AGENCY PROCESS OVERRIDES
#    The system ships with a default cold outbound process. Where FNNL's own
#    process differs, record it here so the skills follow FNNL's way rather
#    than the inherited default. Leave empty until you have actually confirmed
#    how FNNL works; an invented process is worse than no override.
# =============================================================================

process_overrides:

  client_onboarding_steps: null     # FNNL's own onboarding sequence, if different
  approval_gates: null              # what FNNL requires client sign-off on, and when
  campaign_naming_convention: null  # how FNNL names campaigns across clients
  reporting_cadence: null           # how often clients get reporting, in what format
  deliverable_format: null          # what FNNL actually hands a client
  copy_review_policy: null          # who reviews copy before it goes live
  notes: >
    /stack-setup asks about these. Anything left null means the system uses
    its built-in default, which is documented in the matching skill.
    ACCOUNT OWNERSHIP, confirmed by operator 2026-09-18: FNNL OWNS EVERYTHING.
    FNNL buys the domains and inboxes and runs every client inside its own
    Plusvibe, ScaledMail and HeyReach accounts. Clients are tenants, not
    account holders. Consequences the skills should assume: one credential set
    covers all clients rather than per-client keys; domain and sending
    reputation is FNNL's asset to protect, so one client's bad list damages
    other clients' deliverability; and a departing client cannot take the
    infrastructure with them, which is a commercial conversation to have at
    offboarding rather than a technical one.
    Everything else above is still null and therefore still on the built-in
    default. approval_gates in particular is the one most likely to differ per
    agency and is client-visible when wrong, so capture it before the first
    client deliverable ships.

# =============================================================================
# FORMAT REFERENCE (for hand-editing)
# =============================================================================
#
# A filled slot looks like this:
#
#   sending_platform:
#     tool: "Instantly"
#     status: live
#     capability: >
#       (leave the shipped wording, it describes the job not the tool)
#     run_state_field: run_state.sending_platform
#     credentials: [INSTANTLY_API_KEY]
#     vendor_pack: null
#     notes: >
#       Verified 2026-09-20 against a real campaign-create call.
#
# A decided POLICY slot (not a tool) keeps `tool: null` and records the
# decision in `value`, for example:
#
#   research_routing:
#     tool: null
#     value: claude_deep_research
#     status: chosen
#
# A RETIRED slot keeps `tool: null`, `status: retired`, `credentials: []`,
# and says in its notes what Claude Code does instead.
#
# After editing by hand:
#   1. Add any new credential names to scripts/.env.example (names only, never
#      real key values).
#   2. Put the real values in scripts/.env, which is gitignored.
#   3. Run /preflight-credentials to confirm the keys resolve.
#
# =============================================================================
