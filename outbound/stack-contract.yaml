      nothing extra to adopt. Reassign freely if FNNL prefers a separate search tool.

  crawl:
    tool: Parallel.ai
    status: chosen
    capability: Website crawling and content extraction for company research and signal detection.
    run_state_field: null
    credentials: [PARALLEL_API_KEY]
    vendor_pack: null
    notes: >
      Parallel's Extract API. MAPPING INFERRED, NOT STATED, on the same basis as
      web.search above. Covers page content extraction for company research and
      signal detection. If FNNL later needs deep multi-page site crawls rather than
      targeted extraction, re-evaluate: the parked spider MCP connector in
      _vendor-library/mcp-connectors.json is the alternative already catalogued.

