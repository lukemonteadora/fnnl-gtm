#    sub-agents, the /deep-research fan-out harness, and its built-in
#    WebSearch and WebFetch). No third-party AI API is called, and no Claude
#    API call is made with a key. So research_provider, bulk_classification
#    and copywriting are RETIRED slots, not gaps. image_generation survives
#    for sender headshots only, as the one approved exception recorded in
#    approved_stack.approved_exceptions. /ai-model-routing holds the doctrine.
