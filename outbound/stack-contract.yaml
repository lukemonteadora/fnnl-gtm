      HISTORY, kept for reference (2026-09-18, then held 2026-09-22):
      Parallel.ai was recorded here as a purpose-built agent web-research
      engine returning source-attributed results with calibrated confidence
      (Search API, Task API for deep research, FindAll for entity discovery,
      Monitor for continuous tracking). It was a research engine only and did
      not fill bulk_classification or copywriting.

  bulk_classification:
    tool: null
    status: retired
    capability: >
      Cheap, high-volume classification and extraction at TAM scale (ICP fit
      scoring, hard-no filtering, field extraction across thousands of rows).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      RETIRED BY THE NO-AI-API RULE (operator directive 2026-09-22). Claude
      Code does this job natively: Claude sub-agents fanned out with the
      Task/Agent tool per /personalization-subagent-pattern (disjoint batches,
      one output file per agent, merge by a stable id, post-merge dedupe).
      Deterministic filters (hard-no rules, firmographic cuts) stay in plain
      code with no AI. /lead-scoring and the classification passes in
      /tam-build run this way; there is no scripted provider path and none is
      to be added.
      HONEST LIMIT: sub-agent fan-out is bounded by session time and context,
      not by a per-token bill, so a tens-of-thousands-row TAM runs in waves of
      batches, and the fit prompt is tuned on a sample before the full set.
      Claude Code usage is not a per-call metered API spend in these skills,
      so /api-cost-governance has no AI preview to run for it.
      HISTORY (2026-09-18): recorded as a GAP because FNNL had no LLM API key.

  copywriting:
    tool: null
    status: retired
    capability: >
      Final campaign copy and nuanced analysis, where quality beats cost.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      RETIRED BY THE NO-AI-API RULE (operator directive 2026-09-22). Final
      copy, phone scripts and per-lead personalization are written in the
      native Claude Code session from the clean research packet (a
      clean-packet sub-agent is fine, and /personalization-subagent-pattern
