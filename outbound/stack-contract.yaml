      tested against a live account upstream and has no reply-to-pipeline sync.
      WHAT THIS BLOCKS: replies that turn into real conversations have no system of
      record beyond the sending platform's own inbox.

  reporting_destination:
    tool: null
    status: not_chosen
    capability: >
      Where recurring campaign reporting is delivered (a chat workspace, an
      email digest, a shared dashboard).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Not chosen. The operator's stack list named no reporting destination.
      WHAT THIS BLOCKS: /cold-email-weekly-rhythm and recurring campaign reporting
      have nowhere to deliver. Reporting has to be pulled manually from Plusvibe.

  document_generation:
    tool: Built-in DOCX/PPTX builders (outbound/scripts/)
    status: chosen
    capability: >
      Produces the client-facing deliverables: approval briefs, campaign
      sequence presentations, follow-up decks.
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Keeping the shipped builders, per /stack-setup's recommendation. They are
      already wired to the four client-facing presentation skills
      (campaign-approval-brief, cold-email-campaign-sequence-docx-presentation,
      cold-email-followups-docx-presentation, interested-replies-docx-presentation)
      and need no credential.
      NOT YET PROVEN against an FNNL deliverable. They ran in the upstream workspace,
      so treat them as a working scaffold until one brief is generated end to end.

  spreadsheet:
    tool: null
    status: not_chosen
    capability: >
      Shared tracking surfaces (mailbox inventory, per-client inbox and cost
      tracking, pool staging).
    run_state_field: null
    credentials: []
    vendor_pack: null
    notes: >
      Not chosen. The operator's stack list did not name a spreadsheet tool.
      NOTE, not a decision: a google-docs MCP server is already connected at the user
      level of this machine and covers docs, drive and sheets. If FNNL wants Google
      Sheets here, that connection likely satisfies it with no new purchase, but it
      has not been verified against an FNNL-owned Drive and is not recorded as chosen
      on that basis.
      WHAT THIS BLOCKS: /mailbox-pool-staging expects two sheets and still holds
      <FNNL_MAILBOX_POOL_SHEET_ID> and <FNNL_MAILBOX_TRACKER_SHEET_ID> as
      placeholders. Until a spreadsheet surface is chosen and those IDs are filled,
