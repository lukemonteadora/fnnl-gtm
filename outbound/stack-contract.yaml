      Primary web research engine for ICP, offer, and account research. Should
      return sourced, citable answers rather than unattributed prose.
    # run_state.ai_research_provider is a PROVENANCE field that 50+ skills
    # read. It keeps its name and now records what Claude Code ran, for
    # example claude-deep-research (+ claude-websearch gap passes).
    run_state_field: run_state.ai_research_provider
    credentials: []
    vendor_pack: null
    notes: >
      RETIRED BY THE NO-AI-API RULE (operator directive 2026-09-22). Claude
      Code does this job natively: the primary research pass is the Claude
      native /deep-research fan-out harness (logged, and audited by
      scripts/research/research_routing_check.mjs), and thin spots are filled
