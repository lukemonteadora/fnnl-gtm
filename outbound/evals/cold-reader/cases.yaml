# CONSTRUCTED CASES. Every company, person, product and offer below is fictional and written for this file.
# No client copy, no client data and no other workspace's material is used.
#
# The set is 20 emails: 10 segments, each with an UNCLEAR version (vague deliverable, planted jargon, no
# sentence saying what the sender does) and a PLAIN rewrite of the same offer (specific deliverable, one plain
# context sentence). Each email is read by one fictional reader, so a run holds 20 packets, one fresh sub-agent each. `expect: unclear`
# means the reader should answer "cannot tell" on one of the fields named in `cannot_tell_any`; `expect: clear`
# means no field may be "cannot tell". `jargon_terms` are the planted terms the reader should flag.
#
# These labels are constructed, not client or operator labels, so this benchmark proves the reader tier can tell
# unclear copy from plain copy. It does not prove replies. The 20-row agreement check on real emails is the
# separate second half of the keep rule (README).
#
# Version 2 (2026-09-30). The first baseline run (2/20 pass) showed the constructed plain rewrites never said WHY
# the offer is free, so readers correctly answered "cannot tell" on why_these_terms. The plain versions now carry
# one plain reason sentence, and the unclear versions are gold-labelled to fail on why_these_terms as well.

- id: s01-unclear-p1
  description: "CONSTRUCTED: unclear version, segment s01, reader 1"
  vars:
    persona:
      title: "Owner"
      company: "Maple Court Dental"
      size: "6 staff"
      sells: "family dentistry"
      awareness: "you have not looked for this kind of service"
    sender_name: "Sam Ortiz"
    email:
      subject: "question about calls"
      body: |
        Dana, if we could run a no-cost inbound capture leakage audit on your front-desk funnel, would that be worth sharing more?
    signature: |
      Sam Ortiz
      Northfield Growth
    gold:
      label_status: constructed
      expect: unclear
      cannot_tell_any: ["what_offered", "who_sends", "why_these_terms"]
      jargon_terms: ["inbound capture leakage audit", "funnel"]
      forbidden_search_terms: ["Northfield Growth", "Sam Ortiz"]

